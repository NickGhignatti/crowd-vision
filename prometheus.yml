global:
  scrape_interval: 30s # how often Prometheus pulls /metrics
  evaluation_interval: 30s # how often it evaluates alerting rules

rule_files:
  - "prometheus.rules.yml"

scrape_configs:
  - job_name: "digital-twin"
    static_configs:
      - targets: ["digital-twin:3000"]
    metrics_path: /metrics
  - job_name: "chat"
    static_configs:
      - targets: ["chat:3000"]
    metrics_path: /metrics
  - job_name: "dashboard"
    static_configs:
      - targets: ["dashboard:3000"]
    metrics_path: /metrics
  - job_name: "socket"
    static_configs:
      - targets: ["socket:3000"]
    metrics_path: /metrics
  - job_name: "telemetry"
    static_configs:
      - targets: ["telemetry:3000"]
    metrics_path: /metrics
