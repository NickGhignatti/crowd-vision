# `deps` / `audit` / `relock` are inherited from .moon/tasks/python.yml. The inherited
# `test` / `lint` shell out to npm, which this package cannot do because the root
# .gitignore ignores every package.json; they call uv directly instead, matching CI.
language: 'python'

tasks:
  test:
    script: 'uv run pytest'
    inputs:
      - '*.py'
      - 'tests/**/*'
      - 'pyproject.toml'

  lint:
    script: 'uv run ruff check . && uv run pyright'
    inputs:
      - '*.py'
      - 'pyproject.toml'

  lint-fix:
    script: 'uv run ruff check --fix . && uv run ruff format .'
    options:
      cache: false
