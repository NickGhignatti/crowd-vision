services:
  sensor-simulator:
    cpus: "3"
    build:
      context: .
    environment:
      - TELEMETRY_INGEST_SECRET=${TELEMETRY_INGEST_SECRET}
    ports:
      - "3001:3000"
    # Resolve `host.docker.internal` on hosts that don't provide it automatically;
    # the simulator rewrites localhost targets to it to reach the host's gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
