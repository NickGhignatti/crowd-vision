# Backend integration-test harness — its pytest suite runs against a composed
# stack via `just test integration`, not a moon `:test` task; `language: python` still gives it `deps` and registers it with moon.
# The inherited python `test`/`lint` tasks shell out to npm (agent-service wraps uv in a
# package.json); this project has none, so they are excluded rather than stubbed.
language: 'python'

workspace:
  inheritedTasks:
    exclude:
      - 'test'
      - 'lint'
      - 'lint-fix'
