services:
  sensor-db:
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  sensor-service:
    depends_on:
      sensor-db:
        condition: service_healthy
      # Not declared in sensor-service's own docker-compose.yml (it only
      # gates on sensor-db/kafka there) even though it needs Redis at
      # runtime — usually masked in the full dev stack by there being
      # enough other slow-starting services for redis to be ready well
      # before it matters. This suite's smaller, faster-starting stack
      # exposes the race directly.
      redis:
        condition: service_healthy
    healthcheck:
      # sensor-service has no /metrics route (that's /contracts — a metrics
      # catalog, a different thing) — was always checking a 404.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  socket-server:
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(()=>process.exit(0)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  contracts-service:
    depends_on:
      redis:
        condition: service_healthy
      sensor-service:
        condition: service_healthy

  integration-tests:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /workspace
    command: ["uv", "run", "pytest", "-v"]
    environment:
      - SENSOR_SERVICE_URL=http://sensor-service:3000
      - SOCKET_SERVICE_URL=http://socket-server:3000
      - CONTRACTS_SERVICE_URL=http://contracts-service:3000
    volumes:
      # :z relabels the bind mount for SELinux-enforcing hosts (same reason
      # the root compose file's gateway service does it for its own mounts)
      # — without it the container can't read anything under /workspace.
      - ./:/workspace:z
    depends_on:
      sensor-service:
        condition: service_healthy
      socket-server:
        condition: service_healthy
      contracts-service:
        condition: service_started
    restart: "no"
