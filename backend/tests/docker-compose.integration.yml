services:
  socket-server:
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  contracts-service:
    depends_on:
      redis:
        condition: service_healthy
      telemetry-service:
        condition: service_healthy

  integration-tests:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /workspace
    # -s: the LD-4 tests print measured latency/throughput baselines (issue
    # #340); pytest captures stdout of passing tests without it.
    command: ["uv", "run", "pytest", "-v", "-s"]
    environment:
      - TELEMETRY_SERVICE_URL=http://telemetry-service:3000
      - SOCKET_SERVICE_URL=http://socket-server:3000
      - CONTRACTS_SERVICE_URL=http://contracts-service:3000
    volumes:
      # :z relabels the bind mount for SELinux-enforcing hosts (same reason
      # the root compose file's gateway service does it for its own mounts)
      # — without it the container can't read anything under /workspace.
      - ./:/workspace:z
    depends_on:
      telemetry-service:
        condition: service_healthy
      socket-server:
        condition: service_healthy
      contracts-service:
        condition: service_started
    restart: "no"
