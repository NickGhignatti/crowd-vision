services:
  registry:
    build:
      target: dev
    # Shared on purpose: Go locks inside its own caches, so four services can use them at once.
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    develop:
      watch:
        - action: sync
          path: ./
          target: /app/backend/registry
        - action: rebuild
          path: ./go.mod

  registry-db:
    ports:
      - "5434:5432"

volumes:
  go-mod-cache:
  go-build-cache:
