[package]
name = "contracts-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
claims-contracts = { path = "../claims-contracts" }
dashmap = "6.2.1"
env_logger = { version = "0.11.10", default-features = false, features = ["humantime"] }
futures = "0.3.32"
log = "0.4.32"
mongodb = "3"
redis = { version = "1.2.3", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
telemetry-contracts = { path = "../telemetry-contracts" }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal"] }
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
wiremock = "0.6"

[profile.release]
overflow-checks = true
