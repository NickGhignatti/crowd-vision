services:
  chat-service:
    build:
      target: dev
    command: cargo watch -x run
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/backend/chat-service/src
        - action: rebuild
          path: ./Cargo.toml
    volumes:
      - chat-target:/app/backend/chat-service/target
      - cargo-registry:/usr/local/cargo/registry

  chat-db:
    ports:
      - "27021:27017"

  chat-db-express:
    image: mongo-express:latest
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://chat-db:27017/
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_SITE_BASEURL=/chat-db-gui/
    depends_on:
      - chat-db

volumes:
  chat-target:
  cargo-registry:
