[package]
name = "chat-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1.91"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = "0.22"
bytes = "1"
claims-contracts = { path = "../claims-contracts" }
dashmap = "6.2.1"
env_logger = { version = "0.11.10", default-features = false, features = ["humantime"] }
futures = "0.3.32"
log = "0.4.32"
mongodb = "3"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
prometheus = { version = "0.14", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
overflow-checks = true
