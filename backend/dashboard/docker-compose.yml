services:
  dashboard:
    cpus: "3"
    build:
      context: ../..
      dockerfile: backend/dashboard/Dockerfile
      additional_contexts:
        rust-base: service:rust-base
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://dashboard-db:27017/contractsdb
      - SENSOR_METRICS_URL=http://telemetry:3000
      - TWIN_METRICS_URL=http://digital-twin:3000
    depends_on:
      - redis
      - dashboard-db

  dashboard-db:
    cpus: "3"
    image: mongo:8.3.9
    # Default cache is half of host RAM per instance; four of them would each claim ~7GB.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - dashboard-data:/data/db

volumes:
  dashboard-data:
