services:
  dashboard-db:
    image: mongo:7

  dashboard-redis:
    image: redis:7-alpine

  # tunnel.rs needs both -- it resolves a channel from Mongo, then fans out on Redis.
  dashboard-test:
    build:
      context: ../..
      dockerfile: backend/dashboard/Dockerfile
      target: dev
    command: ["bash", "/app/scripts/test/rust-integration-tests.sh"]
    environment:
      - MONGO_URI=mongodb://dashboard-db:27017
      - REDIS_URL=redis://dashboard-redis:6379
    # Mounted, not COPYed (as chat does): one shared copy, no rebuild when it changes.
    volumes:
      - ../../scripts/test/rust-integration-tests.sh:/app/scripts/test/rust-integration-tests.sh:ro
    depends_on:
      - dashboard-db
      - dashboard-redis
