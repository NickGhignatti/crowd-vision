include:
  - path: ../../docker/rust-base/docker-compose.yml

services:
  dashboard-db:
    image: mongo:8.3.9

  dashboard-redis:
    image: redis:8.10.1-alpine

  # tunnel.rs needs both -- it resolves a channel from Mongo, then fans out on Redis.
  dashboard-test:
    build:
      context: ../..
      dockerfile: backend/dashboard/Dockerfile
      additional_contexts:
        rust-base: service:rust-base
      target: dev
    command: ["bash", "/app/scripts/test/rust-integration-tests.sh"]
    environment:
      - MONGO_URI=mongodb://dashboard-db:27017
      - REDIS_URL=redis://dashboard-redis:6379
    # Mounted, not COPYed: one shared copy of the runner, no image rebuild when it changes.
    volumes:
      - ../../scripts/test/rust-integration-tests.sh:/app/scripts/test/rust-integration-tests.sh:ro
    depends_on:
      - dashboard-db
      - dashboard-redis
