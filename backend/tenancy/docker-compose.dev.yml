services:
  tenancy:
    build:
      target: dev
    # Shared on purpose: Go locks inside its own caches, so four services can use them at once.
    volumes:
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "-O", "/dev/null", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    develop:
      watch:
        - action: sync
          path: ./
          target: /app/backend/tenancy
        - action: rebuild
          path: ./go.mod

  tenancy-db:
    ports:
      - "5433:5432"

  tenancy-db-adminer:
    image: adminer:6.0.1
    environment:
      - ADMINER_DEFAULT_SERVER=tenancy-db
    depends_on:
      - tenancy-db

volumes:
  go-mod-cache:
  go-build-cache:
