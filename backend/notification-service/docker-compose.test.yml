services:
  redis:
    image: redis:alpine

  notification-db:
    image: mongo:7

  notification-kafka:
    image: apache/kafka:3.9.2
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://notification-kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@notification-kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  notification-service-test:
    build:
      context: .
      target: test
    command: ["bash", "/app/scripts/test/rust-integration-tests.sh"]
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://notification-db:27017
      - KAFKA_BROKERS=notification-kafka:9092
    volumes:
      - ../../scripts/test/rust-integration-tests.sh:/app/scripts/test/rust-integration-tests.sh:ro
    depends_on:
      - redis
      - notification-db
      - notification-kafka
