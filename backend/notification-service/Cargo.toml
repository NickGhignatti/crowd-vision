[package]
name = "notification-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1.91"
axum = "0.8.9"
base64 = "0.22"
dashmap = "6.2.1"
env_logger = "0.11.10"
futures = "0.3.32"
log = "0.4.32"
mongodb = "3"
prometheus = "0.14"
redis = { version = "1.2.3", features = ["tokio-comp"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.52.3", features = ["full"] }
urlencoding = "2"
web-push = { version = "0.11", default-features = false }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"

[profile.release]
overflow-checks = true
