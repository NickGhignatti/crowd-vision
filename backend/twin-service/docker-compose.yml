services:
  twin-service:
    cpus: "2"
    build:
      # Repo-root context: twin-service needs to see its sibling ../auth-policy
      # dir (shared Cedar policy bundle) during build.
      context: ../..
      dockerfile: backend/twin-service/Dockerfile
    environment:
      - MONGO_URI=mongodb://twin-db:27017/twindb
      - SENSOR_SERVICE_URL=http://sensor-service:3000
      - CONTRACTS_SERVICE_URL=http://contracts-service:3000
      - KAFKA_BROKERS=kafka:9092
    depends_on:
      twin-db:
        condition: service_started
      kafka:
        condition: service_healthy

  twin-db:
    cpus: "2"
    image: mongo:latest
    volumes:
      - twin-data:/data/db

volumes:
  twin-data:
