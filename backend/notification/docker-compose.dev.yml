services:
  notification:
    build:
      target: dev
    command: cargo watch -x run
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/backend/notification/src
        - action: rebuild
          path: ./Cargo.toml
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    volumes:
      - notification-target:/app/backend/notification/target
      - cargo-registry:/usr/local/cargo/registry

  notification-db:
    ports:
      - "27019:27017"

  notification-db-express:
    image: mongo-express:latest
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://notification-db:27017/
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_SITE_BASEURL=/notification-db-gui/
    depends_on:
      - notification-db

volumes:
  notification-target:
  cargo-registry:
