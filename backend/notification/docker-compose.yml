services:
  notification:
    cpus: "3"
    build:
      # Repo-root context: the service needs its sibling ../claims-contracts during build.
      context: ../..
      dockerfile: backend/notification/Dockerfile
      additional_contexts:
        rust-base: service:rust-base
    environment:
      - REDIS_URL=redis://redis:6379
      - MONGO_URI=mongodb://notification-db:27017/notificationdb
      - DIGITAL_TWIN_URL=http://digital-twin:3000
      - KAFKA_BROKERS=kafka:9092
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
    depends_on:
      notification-db:
        condition: service_started
      kafka:
        condition: service_healthy

  notification-db:
    cpus: "3"
    image: mongo:8.3.9
    # Default cache is half of host RAM per instance; four of them would each claim ~7GB.
    command: ["--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - notification-data:/data/db

volumes:
  notification-data:
