[package]
name = "socket"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "0.22"
claims-schema = { path = "../../schemas/claims-schema" }
env_logger = { version = "0.11.10", default-features = false, features = [
    "humantime",
] }
futures-util = { version = "0.3.32", default-features = false, features = ["std"] }
log = "0.4.32"
prometheus = { version = "0.14", default-features = false }
redis = { version = "1.2.3", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
telemetry-schema = { path = "../../schemas/telemetry-schema" }
socketioxide = { version = "=0.18.6", features = ["extensions", "state"] }
tokio = { version = "1.52.3", features = [
    "macros",
    "net",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.6", features = ["cors"] }

[dev-dependencies]
rust_socketio = { version = "0.6", features = ["async"] }
wiremock = "0.6"

[profile.release]
overflow-checks = true
