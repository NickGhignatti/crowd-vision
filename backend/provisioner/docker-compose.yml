services:
  provisioner:
    cpus: "3"
    build:
      context: ../..
      dockerfile: backend/provisioner/Dockerfile
    environment:
      - REGISTRY_URL=http://registry:3000
      - TENANCY_URL=http://tenancy:3000
      - INTERNAL_SIGNING_SECRET=${INTERNAL_SIGNING_SECRET}
    depends_on:
      - registry
      - tenancy
