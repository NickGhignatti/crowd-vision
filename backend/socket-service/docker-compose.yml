services:
  socket-server:
    cpus: "3"
    build:
      # Repo-root context: the service needs its sibling ../claims-contracts during build.
      context: ../..
      dockerfile: backend/socket-service/Dockerfile
    container_name: crowd-vision-socket
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=${DEV_URL}:${FRONTEND_PORT}
      - TWIN_SERVICE_URL=http://twin-service:3000
    depends_on:
      - redis
