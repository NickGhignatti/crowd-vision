services:
  redis:
    image: redis:alpine

  socket-service-test:
    build:
      context: .
      target: dev
    command: ["bash", "/app/scripts/rust-integration-tests.sh"]
    environment:
      - REDIS_URL=redis://redis:6379
    volumes:
      - ../../scripts/rust-integration-tests.sh:/app/scripts/rust-integration-tests.sh:ro
    depends_on:
      - redis
