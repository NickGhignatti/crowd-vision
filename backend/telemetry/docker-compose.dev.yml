services:
  telemetry:
    build:
      target: dev
    command: cargo watch -x run
    # The dev image runs `cargo run`, so the release binary's `--health` probe does not exist here.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/backend/telemetry/src
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock

  telemetry-db:
    ports:
      - "5432:5432"

  telemetry-db-gui:
    image: sosedoff/pgweb:0.17.0
    environment:
      - PGWEB_DATABASE_URL=postgres://telemetry:telemetry@telemetry-db:5432/telemetrydb?sslmode=disable
      - PGWEB_PREFIX=telemetry-db-gui
    depends_on:
      telemetry-db:
        condition: service_healthy
