services:
  telemetry:
    cpus: "3"
    build:
      # Repo-root context: telemetry needs its sibling ../auth-policy and
      # ../auth-contracts (shared Cedar bundle) during build.
      context: ../..
      dockerfile: backend/telemetry/Dockerfile
      additional_contexts:
        rust-base: service:rust-base
    environment:
      - DATABASE_URL=postgres://telemetry:telemetry@telemetry-db:5432/telemetrydb
      - REDIS_URL=redis://redis:6379
      - KAFKA_BROKERS=kafka:9092
      - DIGITAL_TWIN_URL=http://digital-twin:3000
      # Which simulator simulates which device kind; a kind no simulator claims is never sent.
      - 'SIMULATORS={"sensor-simulator":{"url":"http://sensor-simulator:3000","kinds":["temperature","peopleCount"]},"aq-simulator":{"url":"http://aq-simulator:3000","kinds":["airQuality"]},"ap-simulator":{"url":"http://ap-simulator:3000","kinds":["router"]}}'
      - TELEMETRY_INGEST_SECRET=${TELEMETRY_INGEST_SECRET}
      - TELEMETRY_DEVICE_MASTER_KEY=${TELEMETRY_DEVICE_MASTER_KEY}
      - PORT=3000
      - RUST_LOG=info
    healthcheck:
      test: ["CMD", "/usr/local/bin/telemetry", "--health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      telemetry-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  telemetry-db:
    cpus: "3"
    image: timescale/timescaledb:2.30.0-pg17
    environment:
      - POSTGRES_USER=telemetry
      - POSTGRES_PASSWORD=telemetry
      - POSTGRES_DB=telemetrydb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetrydb"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - telemetry-data:/var/lib/postgresql/data

volumes:
  telemetry-data:
