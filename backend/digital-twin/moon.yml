language: 'rust'

# build / lint are inherited from .moon/tasks/rust.yml. `test` is overridden
# below: src/ holds only unit tests now (no real infra), tests/*.rs holds
# integration tests that need a real MongoDB (see test-integration.sh).
tasks:
  test:
    command: 'cargo test --lib'
  test-integration:
    command: 'bash test-integration.sh'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
    options:
      cache: false
