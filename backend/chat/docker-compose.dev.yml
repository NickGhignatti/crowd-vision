services:
  chat:
    build:
      target: dev
    command: cargo watch -x run
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/backend/chat/src
        - action: rebuild
          path: ./Cargo.toml
        - action: rebuild
          path: ./Cargo.lock

  chat-db:
    ports:
      - "27021:27017"

  chat-db-express:
    image: mongo-express:1.0.2
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://chat-db:27017/
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
      - ME_CONFIG_SITE_BASEURL=/chat-db-gui/
    depends_on:
      - chat-db
