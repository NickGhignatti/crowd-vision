services:
  chat-db:
    image: mongo:7

  chat-test:
    build:
      context: ../..
      dockerfile: backend/chat/Dockerfile
      target: test
    command: ["bash", "/app/scripts/test/rust-integration-tests.sh"]
    environment:
      - MONGO_URI=mongodb://chat-db:27017
    volumes:
      - ../../scripts/test/rust-integration-tests.sh:/app/scripts/test/rust-integration-tests.sh:ro
    depends_on:
      - chat-db
