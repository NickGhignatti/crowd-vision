services:
  telemetry-db:
    image: timescale/timescaledb:2.17.2-pg17
    command: ["postgres", "-c", "max_connections=400", "-c", "shared_buffers=256MB"]
    environment:
      - POSTGRES_PASSWORD=telemetry
      - POSTGRES_DB=telemetrydb

  telemetry-redis:
    image: redis:8-alpine

  telemetry-kafka:
    image: apache/kafka:3.9.2
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://telemetry-kafka:9092
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@telemetry-kafka:9093
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

  telemetry-service-test:
    build:
      context: ../..
      dockerfile: backend/telemetry-service/Dockerfile
      target: dev
    command: ["bash", "/app/scripts/test/rust-integration-tests.sh"]
    environment:
      - DATABASE_URL=postgres://postgres:telemetry@telemetry-db:5432/telemetrydb
      - REDIS_URL=redis://telemetry-redis:6379
      - KAFKA_BROKERS=telemetry-kafka:9092
      - TELEMETRY_INGEST_SECRET=integration-ingest-secret-0123456789
    depends_on:
      - telemetry-db
      - telemetry-redis
      - telemetry-kafka
