services:
  telemetry-db:
    image: timescale/timescaledb:2.17.2-pg17
    environment:
      - POSTGRES_PASSWORD=telemetry
      - POSTGRES_DB=telemetrydb

  telemetry-service-test:
    build:
      context: ../..
      dockerfile: backend/telemetry-service/Dockerfile
      target: dev
    command: ["bash", "/app/scripts/rust-integration-tests.sh"]
    environment:
      - DATABASE_URL=postgres://postgres:telemetry@telemetry-db:5432/telemetrydb
    depends_on:
      - telemetry-db
