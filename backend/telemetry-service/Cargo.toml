[package]
name = "telemetry-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
cedar-policy = "4"
log = "0.4.33"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
overflow-checks = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
