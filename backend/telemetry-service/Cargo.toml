[package]
name = "telemetry-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "query", "tokio"] }
base64 = "0.22"
cedar-policy = "4"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
dashmap = "6.2.1"
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
futures = "0.3"
log = "0.4.33"
prometheus = { version = "0.14", default-features = false }
rdkafka = "0.39"
redis = { version = "1.6.0", default-features = false, features = ["tokio-comp"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "json", "chrono", "migrate", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
urlencoding = "2"

[profile.release]
overflow-checks = true

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
tower = { version = "0.5.3", features = ["util"] }
uuid = { version = "1.24.1", features = ["v4"] }
wiremock = "0.6"
