services:
  agent:
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 3000 --reload"]
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - OBSERVE_PAYLOADS=${OBSERVE_PAYLOADS:-true}
    develop:
      watch:
        - action: sync
          path: ./app
          target: /app/server/agent/app
        - action: rebuild
          path: ./pyproject.toml

  agent-db:
    ports:
      # 5432 is telemetry-db's. Two services publishing it made plain
      # `just stack dev` fail to start; host ports are listed in docker-compose.qd.
      - "5435:5432"
