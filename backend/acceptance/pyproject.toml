[project]
name = "backend-acceptance"
version = "0.1.0"
description = "Cross-service acceptance tests for crowd-vision, organized by acceptance criteria rather than by service."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "python-socketio[client]>=5.11.0",
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["metrics_catalog", "dashboard_freshness"]
pythonpath = ["."]
