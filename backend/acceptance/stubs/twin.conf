server {
    listen 3000;
    listen [::]:3000;
    default_type application/json;

    # socket's subscribe_building gate: GET /domain/{building} must
    # return the building's domains, or the client never joins its room.
    location /domain/ {
        return 200 '["test-domain"]';
    }

    # dashboard metric discovery sweeps every *_METRICS_URL; an empty
    # catalog keeps twin out of the aggregate without logging a fetch error.
    location /contracts {
        return 200 '{"service":"digital-twin","metrics":[]}';
    }

    location /health {
        return 200 '{"status":"ok"}';
    }

    location / {
        return 404 '{"error":"digital-twin stub: unhandled route"}';
    }
}
