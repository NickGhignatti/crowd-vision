server {
    listen 3000;
    listen [::]:3000;
    default_type application/json;

    # Caddy's require_gateway_auth forward_auths every gated route here, as a
    # GET /verify. The real claims-gateway verifies an RS256 JWT and needs
    # Keycloak plus tenancy to boot; backend/acceptance/edge/ only asserts WHICH
    # paths arrive here, so a flat 401 is enough.
    #
    # The body is load-bearing, not decoration: forward_auth proxies a non-2xx
    # auth response back to the client verbatim, so this marker string reaching
    # a test is what distinguishes "the edge rejected it" from "telemetry's own
    # claims extractor rejected it". Both are 401. Keep it in sync with
    # EDGE_REJECTION_MARKER in edge/test_edge_routing.py.
    location /verify {
        return 401 '{"error":"claims-gateway stub: no verified claims"}';
    }

    # Reached as /gateway/health through the edge — the readiness probe for the
    # whole gateway container, since /gateway/* is the one prefix Caddy proxies
    # without require_gateway_auth.
    location /health {
        return 200 '{"status":"ok"}';
    }

    location / {
        return 404 '{"error":"claims-gateway stub: unhandled route"}';
    }
}
