# Redis and Kafka only — the infra the root docker-compose.yml would otherwise
# provide. run-integration-tests.sh composes this suite standalone, without the
# root stack, so it has to supply them itself; the name says "infra" rather than
# being the folder's bare docker-compose.yml because there is nothing base-like
# about it, and everything in this folder is integration testing either way.

services:
  redis:
    cpus: "3"
    image: redis:alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # telemetry depends on Kafka at boot (its building-registration
  # consumer) regardless of whether this suite's tests exercise that flow —
  # same single-node KRaft config as the root stack's own kafka service.
  kafka:
    cpus: "3"
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
