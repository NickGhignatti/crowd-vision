name: CodeQL

on:
  workflow_dispatch:
  pull_request:
    branches: [master]
  schedule:
    - cron: "0 3 * * 1"

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR-only, and scoped to what actually changed — schedule/workflow_dispatch
  # runs (full audit, not a diff) always analyze every language regardless.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      changes: ${{ steps.filter.outputs.changes }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Detect changed languages
        id: filter
        uses: ./.github/actions/filter-languages
        with:
          extra_filters: |
            workflow:
              - '.github/workflows/ci-codeql.yml'

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # build-mode: none extracts from source without compiling
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none
          - language: rust
            build-mode: none
          # Go dropped no-build extraction; autobuild compiles each module CodeQL finds.
          - language: go
            build-mode: autobuild
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      # matrix isn't available in a job-level `if:`, so the skip decision is
      # made here per matrix combination instead. schedule/workflow_dispatch
      # runs (full audit, not a diff) always analyze every language.
      - name: Check if this language changed
        id: check
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ needs.changes.outputs.changes }}
          LANG: ${{ matrix.language }}
        run: |
          RUN=false
          if [ "$EVENT" != "pull_request" ]; then RUN=true; fi
          if echo "$CHANGED" | jq -e --arg lang "$LANG" 'index("workflow") or any(. == $lang)' >/dev/null 2>&1; then RUN=true; fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        if: steps.check.outputs.run == 'true'
        uses: github/codeql-action/init@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended

      - name: Perform CodeQL Analysis
        if: steps.check.outputs.run == 'true'
        uses: github/codeql-action/analyze@dd903d2e4f5405488e5ef1422510ee31c8b32357
        with:
          category: "/language:${{ matrix.language }}"
