name: CI Docker Build

on:
  workflow_call:
    inputs:
      images:
        description: >-
          JSON matrix (include-form) of { image, lang, context, dockerfile } objects to build.
        required: true
        type: string

jobs:
  rust-base:
    if: contains(inputs.images, '"lang":"rust"')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.base.outputs.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish rust-base if missing
        id: base
        uses: ./.github/actions/rust-base

  build:
    name: docker (${{ matrix.image }})
    needs: rust-base
    # rust-base is skipped when no Rust image changed, which would skip this job too
    if: ${{ !cancelled() && needs.rust-base.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.images) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Set lowercase image prefix
        run: |
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/$OWNER_LOWERCASE" >> "$GITHUB_ENV"

      # Same Dockerfile, context and cache scope as cd-registry.yml, which promotes
      # this image on merge: one recipe, whichever path publishes it.
      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          build-contexts: ${{ needs.rust-base.outputs.ref && format('rust-base=docker-image://{0}', needs.rust-base.outputs.ref) || '' }}
          # python images run apt-get upgrade, which a cached layer would skip
          no-cache: ${{ matrix.lang == 'python' }}
          push: false
          load: true
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:pr-${{ github.event.pull_request.head.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Same gate cd-registry.yml applies at merge time, run here instead so the
      # image below is already vetted before it ever reaches GHCR — cd-registry.yml
      # then only has to promote (not rebuild) it once this PR lands on master.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:pr-${{ github.event.pull_request.head.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed under a pr-<head-sha> tag only — never :latest. cd-registry.yml
      # promotes this exact image on merge instead of rebuilding it from scratch.
      - name: Push pr-tagged image (scan passed)
        env:
          IMAGE: ${{ matrix.image }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: docker push "$IMAGE_PREFIX/$IMAGE:pr-$PR_SHA"
