name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 1"

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Run Renovate
        uses: renovatebot/github-action@6d859fc95779be83a0335ca704879b47e5d79641
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "renovate[bot] <29139614+renovate[bot]@users.noreply.github.com>"
          # Three of the last four runs aborted with "Repository has changed
          # during renovation" on days master had no commits at all, and the
          # fourth stopped after one PR with "Lock file error". Neither reason
          # is visible at info level. Drop back to info once both are explained.
          LOG_LEVEL: debug
