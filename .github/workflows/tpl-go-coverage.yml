name: Go Coverage Template
on:
  workflow_call:
    inputs:
      service_key: # artifact name
        required: true
        type: string
      working_directory:
        required: true
        type: string

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-go
        with:
          working_directory: ${{ inputs.working_directory }}

      - name: Build
        run: go build -v ./...

      # Two flags, each fixing an understatement rather than adding tests:
      #   -coverpkg=./...  attributes coverage across package boundaries. Without
      #     it a package is measured only against its OWN tests, so internal/storefake
      #     — exercised by every service and api test — reported 0%.
      #   -tags=integration  compiles the `//go:build integration` store/events
      #     suites, which otherwise run nowhere and report 0% despite existing.
      # Together these moved registry 26.6% -> 55.6% and tenancy 43.2% -> 71.5%
      # without a single new test.
      - name: Test
        run: go test -v -tags=integration -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Convert coverage to XML (Cobertura)
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          $(go env GOPATH)/bin/gocover-cobertura < coverage.out > coverage.xml

      - name: Upload report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ${{ inputs.service_key }}
          path: ${{ inputs.working_directory }}/coverage.xml
          if-no-files-found: error
          retention-days: 1
