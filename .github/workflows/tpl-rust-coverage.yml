name: Rust Coverage Template
on:
  workflow_call:
    inputs:
      service_key: { required: true, type: string }
      working_directory: { required: true, type: string }

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Resolve infra from registry
        id: infra
        run: |
          jq -r --arg k "${{ inputs.service_key }}" \
            '.[] | select(.key == $k)
             | "mongo=\(.needs_mongo // false)",
               "redis=\(.needs_redis // false)",
               "postgres=\(.needs_postgres // false)",
               "kafka=\(.needs_kafka // false)"' \
            .github/services.json >> "$GITHUB_OUTPUT"
        working-directory: ${{ github.workspace }}

      - name: Start Mongo
        if: ${{ steps.infra.outputs.mongo == 'true' }}
        uses: ./.github/actions/setup-mongo

      - name: Start Redis
        if: ${{ steps.infra.outputs.redis == 'true' }}
        uses: ./.github/actions/setup-redis

      - name: Start TimescaleDB
        if: ${{ steps.infra.outputs.postgres == 'true' }}
        uses: ./.github/actions/setup-postgres

      - name: Start Kafka
        if: ${{ steps.infra.outputs.kafka == 'true' }}
        uses: ./.github/actions/setup-kafka

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          working_directory: ${{ inputs.working_directory }}
          service_key: ${{ inputs.service_key }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        working-directory: ${{ inputs.working_directory }}
        env:
          REDIS_URL: redis://localhost:6379
          MONGO_URI: mongodb://localhost:27017
          DATABASE_URL: postgres://postgres:telemetry@localhost:5432/telemetrydb
          KAFKA_BROKERS: localhost:9092
        run: |
          mkdir -p coverage
          cargo llvm-cov --all-targets --json --summary-only --output-path coverage/coverage-summary.json

      - name: Upload report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.service_key }}
          path: ${{ inputs.working_directory }}/coverage/coverage-summary.json
          if-no-files-found: error
          retention-days: 1
