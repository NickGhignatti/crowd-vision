name: CD Registry

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service(s) to build: 'all' or comma-separated services.json keys (e.g. twin,frontend)"
        required: false
        default: "all"
  push:
    branches: ["master"]
    paths:
      - "backend/**"
      - "simulators/**"
      - "frontend/**"
      - ".github/services.json"
      - ".github/workflows/cd-registry.yml"

env:
  REGISTRY: ghcr.io

concurrency:
  group: registry-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      any: ${{ steps.set.outputs.any }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Detect changed services
        id: filter
        uses: ./.github/actions/filter-services
        with:
          extra_filters: |
            workflow:
              - '.github/services.json'
              - '.github/workflows/cd-registry.yml'

      - name: Build matrix
        id: set
        env:
          EVENT: ${{ github.event_name }}
          INPUT: ${{ github.event.inputs.service }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          # Image/context/Dockerfile metadata lives in .github/services.json, the
          # single source of truth also used by ci-gate.yml, cd-coverage.yml, and
          # maint-cleanup.yml — see that file before editing this logic.
          REGISTRY=$(jq -c '[.[] | select(.image) | {
            key: .key,
            image: .image,
            context: (.cd_context // ("./" + .dir)),
            dockerfile: (.dockerfile // ((.cd_context // ("./" + .dir)) + "/Dockerfile"))
          }] | INDEX(.key)' .github/services.json)

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -z "$INPUT" ] || [ "$INPUT" = "all" ]; then
              SELECTED=$(echo "$REGISTRY" | jq -c 'keys')
            else
              SELECTED=$(echo "$INPUT" | jq -Rc 'split(",") | map(gsub("^\\s+|\\s+$";""))')
            fi
          else
            # push: the 'workflow' filter means cd-registry.yml or services.json itself changed -> rebuild all
            if echo "$CHANGED" | jq -e 'index("workflow")' >/dev/null; then
              SELECTED=$(echo "$REGISTRY" | jq -c 'keys')
            else
              SELECTED=$(echo "$CHANGED" | jq -c 'map(select(. != "workflow"))')
            fi
          fi

          MATRIX=$(jq -nc --argjson reg "$REGISTRY" --argjson sel "$SELECTED" \
            '{include: ($sel | map(select($reg[.] != null) | {image: $reg[.].image, context: $reg[.].context, dockerfile: $reg[.].dockerfile}))}')
          if [ "$(echo "$MATRIX" | jq '.include | length')" -gt 0 ]; then ANY=true; else ANY=false; fi

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "any=$ANY" >> "$GITHUB_OUTPUT"
          echo "Selected images: $MATRIX"

  build-and-push:
    needs: changes
    if: ${{ needs.changes.outputs.any == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      actions: read
      security-events: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Set lowercase image prefix
        run: |
          OWNER_LOWERCASE=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_PREFIX=ghcr.io/$OWNER_LOWERCASE" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR CI (ci-docker.yml) already built + Trivy-scanned + pushed this exact
      # tree under a pr-<head-sha> tag before it landed on master. Squash-merge
      # gives github.sha a new commit, so the PR's head SHA has to be resolved
      # via the API rather than read off the push event.
      - name: Resolve merged PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          PR_SHA=$(gh api "repos/${REPO}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.merged_at)][0].head.sha // empty')
          echo "pr_sha=$PR_SHA" >> "$GITHUB_OUTPUT"

      - name: Check for PR-cached image
        id: cache
        if: steps.pr.outputs.pr_sha != ''
        env:
          IMAGE: ${{ matrix.image }}
          PR_SHA: ${{ steps.pr.outputs.pr_sha }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_PREFIX/$IMAGE:pr-$PR_SHA" >/dev/null 2>&1; then
            echo "cached=true" >> "$GITHUB_OUTPUT"
          else
            echo "cached=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set Frontend Build Args
        if: matrix.image == 'crowdvision-frontend' && steps.cache.outputs.cached != 'true'
        run: echo "BUILD_ARGS=VITE_VAPID_PUBLIC_KEY=${{ secrets.VITE_VAPID_PUBLIC_KEY }}" >> $GITHUB_ENV

      # Skipped entirely when a PR-cached image is promoted below. Build into the
      # local daemon only (push: false + load: true) — publishing happens after
      # the Trivy gate passes, so a vulnerable image never reaches GHCR. Revisit
      # if `platforms:` (multi-arch) is added.
      - name: Build ${{ matrix.image }} (local, pre-scan)
        if: steps.cache.outputs.cached != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          build-args: ${{ env.BUILD_ARGS }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve scan target
        env:
          CACHED: ${{ steps.cache.outputs.cached }}
          IMAGE: ${{ matrix.image }}
          PR_SHA: ${{ steps.pr.outputs.pr_sha }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$CACHED" = "true" ]; then
            echo "SCAN_REF=$IMAGE_PREFIX/$IMAGE:pr-$PR_SHA" >> "$GITHUB_ENV"
          else
            echo "SCAN_REF=$IMAGE_PREFIX/$IMAGE:$SHA" >> "$GITHUB_ENV"
          fi

      # Gates the promote/push below (finding = job fails before publish). OS
      # packages only — app deps are already gated pre-merge by per-service audits.
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ${{ env.SCAN_REF }}
          format: sarif
          output: trivy-results-${{ matrix.image }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          trivyignores: .trivyignore
          vuln-type: os # OS packages only — app deps gated by per-service CI

      - name: Upload Trivy scan results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        continue-on-error: true
        with:
          sarif_file: trivy-results-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

      # Registry-side manifest copy — no rebuild. The image already passed this
      # exact Trivy gate once (above) before it was allowed onto master.
      - name: Promote PR-cached image (scan passed)
        if: steps.cache.outputs.cached == 'true'
        env:
          IMAGE: ${{ matrix.image }}
          SHA: ${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE_PREFIX/$IMAGE:latest" \
            --tag "$IMAGE_PREFIX/$IMAGE:$SHA" \
            "$SCAN_REF"

      # Best-effort — maint-cleanup.yml sweeps orphaned tags weekly regardless,
      # so a failure here (GH Packages API is finicky for user-owned packages)
      # isn't load-bearing.
      - name: Delete temp PR tag
        if: steps.cache.outputs.cached == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          IMAGE: ${{ matrix.image }}
          TAG_NAME: pr-${{ steps.pr.outputs.pr_sha }}
        run: |
          VERSION_ID=$(gh api "/users/$OWNER/packages/container/$IMAGE/versions" \
            --jq ".[] | select(.metadata.container.tags[]? == \"$TAG_NAME\") | .id" | head -n1)
          if [ -n "$VERSION_ID" ]; then
            gh api -X DELETE "/users/$OWNER/packages/container/$IMAGE/versions/$VERSION_ID"
          fi

      # Same context/build-args/cache as the pre-scan build, so this resolves from
      # the warm gha cache (no recompile) and pushes the exact scanned layers, now also tagged :latest.
      - name: Push ${{ matrix.image }} (scan passed)
        if: steps.cache.outputs.cached != 'true'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: ${{ env.BUILD_ARGS }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha

      - name: Print image tag
        # Pass expansions through env (set as a literal value), never inline
        # them into the shell — avoids template-injection as a standing pattern.
        env:
          IMAGE_REF: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
        run: echo "Successfully pushed $IMAGE_REF"
