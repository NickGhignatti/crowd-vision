name: Rust CI Template
on:
  workflow_call:
    inputs:
      service_key: { required: true, type: string }
      working_directory: { required: true, type: string }
      needs_mongo: { required: false, type: boolean, default: false }
      needs_redis: { required: false, type: boolean, default: false }

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CARGO_INCREMENTAL: "0"
      RUSTFLAGS: "-C link-arg=-fuse-ld=mold"
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Start Mongo
        if: ${{ inputs.needs_mongo }}
        uses: ./.github/actions/setup-mongo

      - name: Start Redis
        if: ${{ inputs.needs_redis }}
        uses: ./.github/actions/setup-redis

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          working_directory: ${{ inputs.working_directory }}
          service_key: ${{ inputs.service_key }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --release --all-targets -- -D warnings

      # `--lib` errors outright on a bin-only crate (no lib.rs, e.g.
      # contracts-service) instead of skipping, so pick the target kind that
      # actually exists.
      - name: Run Unit Tests
        run: |
          if [ -f src/lib.rs ]; then
            cargo test --release --lib
          else
            cargo test --release --bins
          fi

      - name: Run Integration Tests
        env:
          REDIS_URL: redis://localhost:6379
        run: bash "$GITHUB_WORKSPACE/scripts/rust-integration-tests.sh" --release

      - name: Build Release Binary
        run: cargo build --release

      # The compiled binary is named after the crate (backend/twin-service ->
      # "twin-service"), not the short service_key used for the artifact name.
      - name: Locate Release Binary
        id: bin
        run: echo "name=$(basename "$INPUTS_WORKING_DIRECTORY")" >> "$GITHUB_OUTPUT"
        env:
          INPUTS_WORKING_DIRECTORY: ${{ inputs.working_directory }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: binary-${{ inputs.service_key }}
          path: ${{ inputs.working_directory }}/target/release/${{ steps.bin.outputs.name }}
          retention-days: 1
