name: Go CI Template
on:
  workflow_call:
    inputs:
      service_key:
        required: true
        type: string
      working_directory:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Environment
        uses: ./.github/actions/setup-go
        with:
          working_directory: ${{ inputs.working_directory }}

      # gofmt -l prints offenders and still exits 0, so the loop is what makes it a
      # gate. go vet never looks at formatting, so without this nothing did.
      - name: Check formatting
        env:
          MODULE_DIR: ${{ inputs.working_directory }}
        run: |
          status=0
          for f in $(gofmt -l .); do
            echo "::error file=$MODULE_DIR/$f::not gofmt-formatted — run 'gofmt -w $f' in $MODULE_DIR"
            status=1
          done
          exit $status

      - name: Run go vet
        run: go vet ./...

      # Reachability-based: only advisories whose vulnerable symbols this module
      # actually calls are reported, so it stays quiet enough to gate on. Today
      # every finding is Go stdlib, cleared by keeping setup-go's pin current.
      - name: Audit Dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
        continue-on-error: true

      - name: Build
        run: go build ./...

      # -tags=integration ADDS the tagged files to the normal run rather than
      # replacing it, so this is the unit suite plus any testcontainers suite the
      # module has. Without the tag those files compile nowhere and never run.
      - name: Test
        run: go test -tags=integration ./...
