name: Maint Cleanup Packages

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * 0"

jobs:
  # Reads .github/services.json — the single source of truth for the service
  # list also used by ci-gate.yml, cd-registry.yml, and cd-coverage.yml.
  load-registry:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      images: ${{ steps.list.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: List all published images
        id: list
        run: echo "images=$(jq -c '[.[] | select(.image) | .image]' .github/services.json)" >> "$GITHUB_OUTPUT"

  cleanup:
    needs: load-registry
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        package-name: ${{ fromJSON(needs.load-registry.outputs.images) }}

    steps:
      # delete-package-versions sees the platform manifests under :latest as untagged
      # versions and can delete them; this action keeps whatever a kept tag uses
      - name: Delete old package versions for ${{ matrix.package-name }}
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          package: ${{ matrix.package-name }}
          exclude-tags: latest
          keep-n-tagged: 3
          delete-untagged: true
