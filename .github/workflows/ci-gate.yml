name: CI Gate

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-gate-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      chat: ${{ contains(fromJSON(steps.filter.outputs.changes), 'chat') }}
      agent: ${{ contains(fromJSON(steps.filter.outputs.changes), 'agent') }}
      frontend: ${{ contains(fromJSON(steps.filter.outputs.changes), 'frontend') || contains(fromJSON(steps.filter.outputs.changes), 'frontend_ci_workflow') }}
      dashboard: ${{ contains(fromJSON(steps.filter.outputs.changes), 'dashboard') }}
      notification: ${{ contains(fromJSON(steps.filter.outputs.changes), 'notification') }}
      telemetry: ${{ contains(fromJSON(steps.filter.outputs.changes), 'telemetry') }}
      socket: ${{ contains(fromJSON(steps.filter.outputs.changes), 'socket') }}
      twin: ${{ contains(fromJSON(steps.filter.outputs.changes), 'twin') }}
      claims_gateway: ${{ contains(fromJSON(steps.filter.outputs.changes), 'claims-gateway') }}
      tenancy: ${{ contains(fromJSON(steps.filter.outputs.changes), 'tenancy') }}
      registry: ${{ contains(fromJSON(steps.filter.outputs.changes), 'registry') }}
      provisioner: ${{ contains(fromJSON(steps.filter.outputs.changes), 'provisioner') }}
      auth_policy: ${{ contains(fromJSON(steps.filter.outputs.changes), 'auth-policy') }}
      auth_contracts: ${{ contains(fromJSON(steps.filter.outputs.changes), 'auth-contracts') }}
      auth_middleware: ${{ contains(fromJSON(steps.filter.outputs.changes), 'auth-middleware') }}
      claims_schema: ${{ contains(fromJSON(steps.filter.outputs.changes), 'claims-schema') }}
      telemetry_schema: ${{ contains(fromJSON(steps.filter.outputs.changes), 'telemetry-schema') }}
      twin_schema: ${{ contains(fromJSON(steps.filter.outputs.changes), 'twin-schema') }}
      schema_fixtures: ${{ contains(fromJSON(steps.filter.outputs.changes), 'schema-fixtures') }}
      k8s: ${{ contains(fromJSON(steps.filter.outputs.changes), 'k8s') }}
      shared: ${{ contains(fromJSON(steps.filter.outputs.changes), 'shared') }}
      ci: ${{ contains(fromJSON(steps.filter.outputs.changes), 'ci') }}
      infra: ${{ contains(fromJSON(steps.filter.outputs.changes), 'infra') }}
      simulators: ${{ contains(fromJSON(steps.filter.outputs.changes), 'simulators') }}
      deps: ${{ contains(fromJSON(steps.filter.outputs.changes), 'deps') }}
      docker_matrix: ${{ steps.docker.outputs.matrix }}
      has_images: ${{ steps.docker.outputs.has_images }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Detect changed services
        id: filter
        uses: ./.github/actions/filter-services
        with:
          extra_filters: |
            frontend_ci_workflow:
              - '.github/workflows/ci-frontend.yml'
            k8s:
              - 'k8s/**'
              - '.github/workflows/ci-k8s.yml'
            shared:
              - 'tooling/eslint-config/**'
            schema-fixtures:
              - 'schemas/fixtures/**'
              - 'schemas/json/**'
            ci:
              - '.github/**'
            infra:
              - 'scripts/**'
              - 'tooling/**'
              - 'Justfile'
              - '.github/workflows/ci-infra.yml'
            simulators:
              - 'simulators/**'
              - '.github/workflows/ci-simulators.yml'
            deps:
              - '**/package.json'
              - '**/package-lock.json'
              - '**/pyproject.toml'
              - '**/uv.lock'
              - '**/requirements*.txt'
              - '**/Cargo.toml'
              - '**/Cargo.lock'

      - name: Compute changed Docker images
        id: docker
        env:
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          MATRIX=$(jq -cn --slurpfile reg .github/services.json --argjson changed "$CHANGED" '
            [ $reg[0][] | select(.image and (.ci != false)) | select(.key as $k | $changed | any(. == $k)) |
              {context: ("./" + .dir), image: .image, lang: .lang} ]
          ')

          echo "matrix={\"include\":$MATRIX}" >> "$GITHUB_OUTPUT"
          if [ "$MATRIX" = "[]" ]; then echo "has_images=false" >> "$GITHUB_OUTPUT"; else echo "has_images=true" >> "$GITHUB_OUTPUT"; fi

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/ci-frontend.yml

  auth-contracts:
    needs: changes
    if: needs.changes.outputs.auth_contracts == 'true' || needs.changes.outputs.schema_fixtures == 'true'
    uses: ./.github/workflows/tpl-go-ci.yml
    with:
      service_key: auth-contracts
      working_directory: backend/libs/auth-contracts
      builds_binary: false

  auth-middleware:
    needs: changes
    # auth-middleware's go.mod replaces auth-contracts with a local path, so it
    # builds directly against auth-contracts' source and must re-run when it changes.
    if: needs.changes.outputs.auth_middleware == 'true' || needs.changes.outputs.auth_contracts == 'true'
    uses: ./.github/workflows/tpl-go-ci.yml
    with:
      service_key: auth-middleware
      working_directory: backend/libs/auth-middleware
      builds_binary: false

  auth-policy:
    needs: changes
    if: needs.changes.outputs.auth_policy == 'true'
    uses: ./.github/workflows/tpl-go-ci.yml
    with:
      service_key: auth-policy
      working_directory: backend/libs/auth-policy
      builds_binary: false

  claims-gateway:
    needs: changes
    if: needs.changes.outputs.claims_gateway == 'true' || needs.changes.outputs.auth_contracts == 'true'
    uses: ./.github/workflows/tpl-go-ci.yml
    with:
      service_key: claims-gateway
      working_directory: backend/claims-gateway

  provisioner:
    needs: changes
    if: needs.changes.outputs.provisioner == 'true' || needs.changes.outputs.auth_contracts == 'true'
    uses: ./.github/workflows/tpl-go-ci.yml
    with:
      service_key: provisioner
      working_directory: backend/provisioner

  registry:
    needs: changes
    if: needs.changes.outputs.registry == 'true' || needs.changes.outputs.auth_contracts == 'true'
    uses: ./.github/workflows/tpl-go-ci.yml
    with:
      service_key: registry
      working_directory: backend/registry

  tenancy:
    needs: changes
    if: needs.changes.outputs.tenancy == 'true' || needs.changes.outputs.auth_contracts == 'true'
    uses: ./.github/workflows/tpl-go-ci.yml
    with:
      service_key: tenancy
      working_directory: backend/tenancy

  claims-schema:
    needs: changes
    if: needs.changes.outputs.claims_schema == 'true' || needs.changes.outputs.schema_fixtures == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: claims-schema
      working_directory: schemas/claims-schema
      builds_binary: false

  telemetry-schema:
    needs: changes
    if: needs.changes.outputs.telemetry_schema == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: telemetry-schema
      working_directory: schemas/telemetry-schema
      builds_binary: false

  twin-schema:
    needs: changes
    if: needs.changes.outputs.twin_schema == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: twin-schema
      working_directory: schemas/twin-schema
      builds_binary: false

  chat:
    needs: changes
    if: needs.changes.outputs.chat == 'true' || needs.changes.outputs.claims_schema == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: chat
      working_directory: backend/chat

  notification:
    needs: changes
    if: needs.changes.outputs.notification == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.claims_schema == 'true' || needs.changes.outputs.telemetry_schema == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: notification
      working_directory: backend/notification

  telemetry:
    needs: changes
    if: needs.changes.outputs.telemetry == 'true' || needs.changes.outputs.claims_schema == 'true' || needs.changes.outputs.schema_fixtures == 'true' || needs.changes.outputs.telemetry_schema == 'true' || needs.changes.outputs.twin_schema == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: telemetry
      working_directory: backend/telemetry

  socket:
    needs: changes
    if: needs.changes.outputs.socket == 'true' || needs.changes.outputs.claims_schema == 'true' || needs.changes.outputs.telemetry_schema == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: socket
      working_directory: backend/socket

  twin:
    needs: changes
    if: needs.changes.outputs.twin == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.claims_schema == 'true' || needs.changes.outputs.twin_schema == 'true' || needs.changes.outputs.schema_fixtures == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: twin
      working_directory: backend/digital-twin

  dashboard:
    needs: changes
    if: needs.changes.outputs.dashboard == 'true' || needs.changes.outputs.claims_schema == 'true' || needs.changes.outputs.telemetry_schema == 'true'
    uses: ./.github/workflows/tpl-rust-ci.yml
    with:
      service_key: dashboard
      working_directory: backend/dashboard

  agent:
    needs: changes
    if: needs.changes.outputs.agent == 'true' || needs.changes.outputs.schema_fixtures == 'true'
    uses: ./.github/workflows/tpl-python-ci.yml
    with:
      service_key: agent
      working_directory: backend/agent

  docker:
    needs:
      - changes
      - frontend
      - auth-contracts
      - auth-middleware
      - auth-policy
      - claims-gateway
      - provisioner
      - registry
      - tenancy
      - chat
      - notification
      - telemetry
      - socket
      - twin
      - contracts
      - agent
    if: needs.changes.outputs.has_images == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci-docker.yml
    with:
      images: ${{ needs.changes.outputs.docker_matrix }}

  k8s:
    needs: changes
    if: needs.changes.outputs.k8s == 'true'
    uses: ./.github/workflows/ci-k8s.yml

  workflows-lint:
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: actionlint
        uses: docker://rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -no-color -shellcheck=

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      # A requirements file, not inline pins: Renovate's pip_requirements manager
      # reads this path, but cannot see a version inside a `run:` block.
      - name: Install lint tooling
        run: pip install -r .github/requirements-lint.txt

      - name: zizmor
        run: zizmor --offline --min-severity medium .github/workflows/

      - name: Registry consistency
        run: python scripts/check-workflow-registry.py

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    uses: ./.github/workflows/ci-infra.yml

  simulators:
    needs: changes
    if: needs.changes.outputs.simulators == 'true'
    uses: ./.github/workflows/ci-simulators.yml

  dependency-review:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    uses: ./.github/workflows/ci-dependency-review.yml

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - changes
      - frontend
      - auth-contracts
      - auth-middleware
      - auth-policy
      - claims-gateway
      - provisioner
      - registry
      - tenancy
      - chat
      - notification
      - telemetry
      - socket
      - twin
      - contracts
      - agent
      - docker
      - k8s
      - workflows-lint
      - infra
      - simulators
      - dependency-review
    if: always()
    steps:
      - name: Verify every job succeeded or legitimately skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
          CHANGES: ${{ needs.changes.result }}
        run: |
          echo "results: $RESULTS"
          if [ "$CHANGES" != "success" ]; then
            echo "::error::'changes' ended in '$CHANGES' — CI never actually evaluated this PR"
            exit 1
          fi
          read -ra results <<< "$RESULTS"
          for r in "${results[@]}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended in '$r'"; exit 1 ;;
            esac
          done
          echo "All required jobs passed or were legitimately skipped"
