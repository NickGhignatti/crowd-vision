name: CD Coverage

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coverage-publish
  cancel-in-progress: false

jobs:
  # Reads .github/services.json — the single source of truth for the service
  # list also used by ci-gate.yml, cd-registry.yml, and maint-cleanup.yml —
  # and splits it into one matrix per language, limited to services that
  # actually changed (mirrors cd-registry.yml's own change-detection).
  load-registry:
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.split.outputs.node }}
      python: ${{ steps.split.outputs.python }}
      rust: ${{ steps.split.outputs.rust }}
      go: ${{ steps.split.outputs.go }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Detect changed services
        id: filter
        uses: ./.github/actions/filter-services
        with:
          extra_filters: |
            workflow:
              - '.github/services.json'
              - '.github/workflows/cd-coverage.yml'
              - '.github/workflows/tpl-rust-coverage.yml'
              - '.github/workflows/tpl-go-coverage.yml'
              - '.github/workflows/tpl-node-coverage.yml'
              - '.github/workflows/tpl-python-coverage.yml'

      - name: Split registry by language
        id: split
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          # workflow_dispatch, or services.json/the coverage templates
          # themselves changed -> recompute every service, same convention
          # cd-registry.yml uses for its own "workflow" filter.
          ALL=false
          if [ "$EVENT" = "workflow_dispatch" ]; then ALL=true; fi
          if echo "$CHANGED" | jq -e 'index("workflow")' >/dev/null 2>&1; then ALL=true; fi

          for lang in node python rust go; do
            matrix=$(jq -c --arg l "$lang" --argjson changed "$CHANGED" --argjson all "$ALL" \
              '[.[] | select(.lang == $l and .ci != false and (.key as $k | $all or ($changed | any(. == $k)))) | {key, dir}]' \
              .github/services.json)
            echo "$lang=$matrix" >> "$GITHUB_OUTPUT"
          done

  node:
    name: coverage (node)
    needs: load-registry
    # An empty matrix on a reusable-workflow call errors the run instead of
    # skipping the job, so a push touching only some languages fails CD Coverage
    # with no failing job to point at. Gate on the matrix being non-empty.
    if: ${{ needs.load-registry.outputs.node != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-registry.outputs.node) }}
    uses: ./.github/workflows/tpl-node-coverage.yml
    with:
      service_key: ${{ matrix.key }}
      working_directory: ${{ matrix.dir }}

  python:
    name: coverage (python)
    needs: load-registry
    # An empty matrix on a reusable-workflow call errors the run instead of
    # skipping the job, so a push touching only some languages fails CD Coverage
    # with no failing job to point at. Gate on the matrix being non-empty.
    if: ${{ needs.load-registry.outputs.python != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-registry.outputs.python) }}

    uses: ./.github/workflows/tpl-python-coverage.yml
    with:
      service_key: ${{ matrix.key }}
      working_directory: ${{ matrix.dir }}

  rust:
    name: coverage (rust)
    needs: load-registry
    # An empty matrix on a reusable-workflow call errors the run instead of
    # skipping the job, so a push touching only some languages fails CD Coverage
    # with no failing job to point at. Gate on the matrix being non-empty.
    if: ${{ needs.load-registry.outputs.rust != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-registry.outputs.rust) }}

    uses: ./.github/workflows/tpl-rust-coverage.yml
    with:
      service_key: ${{ matrix.key }}
      working_directory: ${{ matrix.dir }}

  go:
    name: coverage (go)
    needs: load-registry
    # An empty matrix on a reusable-workflow call errors the run instead of
    # skipping the job, so a push touching only some languages fails CD Coverage
    # with no failing job to point at. Gate on the matrix being non-empty.
    if: ${{ needs.load-registry.outputs.go != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.load-registry.outputs.go) }}

    uses: ./.github/workflows/tpl-go-coverage.yml
    with:
      service_key: ${{ matrix.key }}
      working_directory: ${{ matrix.dir }}

  publish:
    name: publish coverage-data
    needs: [node, python, rust, go]
    # Languages with nothing to run are skipped, not failed; publish still has to
    # happen so unchanged services keep their baseline counts. Only a real
    # coverage failure suppresses it.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Download coverage reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: coverage-artifacts

      # Services that didn't change this run produced no artifact above — this
      # pulls their last known counts so the aggregator can merge instead of
      # dropping them from the report. No prior branch (first-ever run) or no
      # push access -> falls back to an empty baseline.
      - name: Fetch previous coverage-counts.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git fetch "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" coverage-data 2>/dev/null \
            && git show FETCH_HEAD:coverage-counts.json > baseline-counts.json 2>/dev/null \
            || echo '{}' > baseline-counts.json

      - name: Aggregate into badge.json + summary.json
        run: python scripts/coverage-summary.py coverage-artifacts . baseline-counts.json

      # Build a single-commit orphan branch holding the generated files.
      # History lives in nothing — each run force-replaces the branch wholesale.
      # coverage-counts.json is the raw-count baseline the next run's partial
      # (changed-services-only) run merges onto — not meant for display.
      - name: Publish to coverage-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan coverage-data-tmp
          git rm -rf --cached . > /dev/null 2>&1 || true
          git add -f badge.json summary.json coverage-counts.json
          git commit -m "coverage: ${SHA:0:7}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" coverage-data-tmp:coverage-data
