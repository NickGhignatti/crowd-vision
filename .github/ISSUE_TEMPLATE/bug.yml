name: Bug Report
description: Report something broken
title: "[fix]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What's broken? What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps, commands, or requests that trigger it
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: service
    attributes:
      label: Affected service(s)
      description: e.g. digital-twin, frontend, tenancy
    validations:
      required: false
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: docker-compose dev stack, k3d/k8s, OS, browser, commit/branch
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / error output
      render: shell
    validations:
      required: false
  - type: textarea
    id: suggestions
    attributes:
      label: Suggestions
      description: Possible fix, or open questions if unsure
    validations:
      required: false
