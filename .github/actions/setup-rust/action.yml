name: 'Rust Setup and Check'
description: 'Install the toolchain, cache and run fmt and clippy'
inputs:
  working_directory:
    required: true
  service_key:
    required: true

runs:
  using: "composite"
  steps:
    - name: Resolve the pinned toolchain
      id: toolchain
      shell: bash
      run: |
        version=$(grep -oP '^rust = "\K[^"]+' "$GITHUB_WORKSPACE/.mise.toml")
        if [[ -z "$version" ]]; then
          echo "no rust pin found in .mise.toml" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659
      with:
        toolchain: ${{ steps.toolchain.outputs.version }}
        components: rustfmt, clippy, llvm-tools-preview
        cache: false

    - name: Cache cargo registry + build artifacts
      uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      with:
        workspaces: ${{ inputs.working_directory }}
        shared-key: "rust-ci-${{ inputs.service_key }}"
