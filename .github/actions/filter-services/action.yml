name: 'Filter Changed Services'
description: 'Path-filter services.json entries (key -> dir and depends_on) against the diff, merged with any extra named filters'
inputs:
  extra_filters:
    description: 'Extra dorny/paths-filter YAML rules to merge in alongside the per-service ones'
    required: false
    default: ''
outputs:
  changes:
    description: 'JSON array of matched filter names (service keys + extra_filters names)'
    value: ${{ steps.filter.outputs.changes || '[]' }}
runs:
  using: "composite"
  steps:
    - name: Build filters from services.json
      shell: bash
      env:
        EXTRA_FILTERS: ${{ inputs.extra_filters }}
      run: |
        # its own command, not inside { ...; printf; }: a group exits with its last command,
        # so a depends_on that disagrees with go.mod/Cargo.toml would not stop the job
        python3 scripts/service-filters.py > filter-services.yml
        printf '%s\n' "$EXTRA_FILTERS" >> filter-services.yml

    - name: Detect changed services
      id: filter
      if: github.event_name == 'push' || github.event_name == 'pull_request'
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
      with:
        filters: filter-services.yml
