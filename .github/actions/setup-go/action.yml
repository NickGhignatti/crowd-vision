name: 'Setup Go Environment'
description: 'Install Go, configure the cache and download dependencies'
inputs:
  working_directory:
    required: true

runs:
  using: "composite"
  steps:
    - name: Resolve the pinned Go version
      id: toolchain
      shell: bash
      run: |
        version=$(grep -oP '^go = "\K[^"]+' "$GITHUB_WORKSPACE/.mise.toml")
        if [[ -z "$version" ]]; then
          echo "no go pin found in .mise.toml" >&2
          exit 1
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        # Stdlib advisories are fixed by patch releases, and govulncheck gates on
        # them — keep the .mise.toml pin current, not merely working.
        go-version: ${{ steps.toolchain.outputs.version }}
        cache: true
        cache-dependency-path: '${{ inputs.working_directory }}/go.sum'

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: go mod download
