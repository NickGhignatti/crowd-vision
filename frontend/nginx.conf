worker_processes auto;
# k8s runs this container with readOnlyRootFilesystem, so every path nginx writes to
# must live under the /tmp emptyDir the deployment mounts.
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path       /tmp/proxy;
    fastcgi_temp_path     /tmp/fastcgi;
    uwsgi_temp_path       /tmp/uwsgi;
    scgi_temp_path        /tmp/scgi;

    access_log off;
    error_log  /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Hashed build assets are immutable; index.html must never be cached or a
        # deploy leaves browsers on the old bundle.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        location = /index.html {
            add_header Cache-Control "no-cache";
        }

        # SPA: vue-router owns every path the build did not emit as a file.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
