<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Sheet border: labelled by the title block, but contains every room. -->
  <rect x="0" y="0" width="400" height="300" fill="none" stroke="#000"/>
  <text x="200" y="295">Ground Floor</text>

  <rect x="20" y="20" width="160" height="120" fill="#cfe8ff" stroke="#000"/>
  <text x="60" y="80">Meeting Room</text>

  <rect x="200" y="20" width="180" height="120" fill="#ffe9c7" stroke="#000"/>
  <text x="240" y="80">Open Space</text>

  <rect x="20" y="160" width="360" height="120" fill="#d8f5d0" stroke="#000"/>
  <text x="60" y="220">Lab 1</text>

  <!-- Partition wall: no label, so not a room. -->
  <rect x="185" y="20" width="10" height="120" fill="#333"/>
</svg>
