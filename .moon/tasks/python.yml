$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  language: 'python'

tasks:
  test:
    command: 'npm test'
    # Contract tests read the shared fixtures; without these a fixture edit replays a cached pass.
    inputs:
      - 'app/**/*'
      - 'tests/**/*'
      - 'pyproject.toml'
      - '/schemas/fixtures/**/*'
      - '/schemas/json/**/*'

  lint:
    command: 'npm run lint'
    inputs:
      - 'app/**/*'
      - 'tests/**/*'
      - 'pyproject.toml'

  lint-fix:
    command: 'npm run lint:fix'
    options:
      cache: false

  deps:
    command: 'uv sync --locked'
    inputs:
      - 'pyproject.toml'
      - 'uv.lock'
    options:
      cache: false

  audit:
    command: 'uv audit'
    inputs:
      - 'pyproject.toml'
      - 'uv.lock'
    options:
      cache: false

  relock:
    command: 'uv lock'
    options:
      cache: false
