$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  language: 'rust'

tasks:
  build:
    command: 'cargo build'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
    outputs:
      - 'target/debug'

  test:
    command: 'cargo test'
    # Contract tests read the shared fixtures; without these a fixture edit replays a cached pass.
    inputs:
      - 'src/**/*'
      - 'tests/**/*'
      - 'Cargo.toml'
      - '/schemas/fixtures/**/*'
      - '/schemas/json/**/*'

  lint:
    command: 'cargo clippy -- -D warnings'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'

  deps:
    command: 'cargo fetch'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      cache: false

  deps-check:
    command: 'cargo check'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'

  audit:
    command: 'cargo audit'
    inputs:
      - 'Cargo.toml'
      - 'Cargo.lock'
    options:
      cache: false
      allowFailure: true
