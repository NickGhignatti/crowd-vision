$schema: 'https://moonrepo.dev/schemas/tasks.json'

inheritedBy:
  language: 'go'

tasks:
  build:
    command: 'go build ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

  test:
    command: 'go test ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'

  # Swap to golangci-lint if/when it's adopted.
  # Formatting first, matching tpl-go-ci.yml so `just lint` fails on exactly what
  # CI fails on. `gofmt -l` exits 0 even when it lists files, hence the test -z.
  lint:
    command: 'sh'
    args:
      - '-c'
      - 'test -z "$(gofmt -l .)" || { echo "not gofmt-formatted:"; gofmt -l .; echo "fix: gofmt -w ."; exit 1; }; go vet ./...'
    inputs:
      - '**/*.go'
      - 'go.mod'

  deps:
    command: 'go mod download'
    inputs:
      - 'go.mod'
      - 'go.sum'
    options:
      cache: false
