[tools]
node = "24"
python = "3.14.8"
rust = "1.99.1"
go = "1.27.3"
"ubi:moonrepo/moon" = "2.6.5"
uv = "0.13.7"
istioctl = "1.31.4"

# Quarkdown is not a mise tool: its release asset is a 92MB zip containing a
# bundled JRE, and the ubi/github backends keep only the launcher script, which
# then cannot find its own classes. It is installed separately (see
# just/docs.just) — the version lives here so `just docs build` and
# cd-documentation.yml read one number instead of drifting apart.
[env]
QUARKDOWN_VERSION = "2.7.0"
