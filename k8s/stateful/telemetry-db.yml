apiVersion: v1
kind: Service
metadata:
  name: telemetry-db
  namespace: crowdvision
spec:
  clusterIP: None
  selector:
    app: telemetry-db
  ports:
    - port: 5432
      targetPort: 5432
      appProtocol: tcp

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telemetry-db
  namespace: crowdvision
spec:
  serviceName: telemetry-db
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-db
  template:
    metadata:
      labels:
        app: telemetry-db
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:2.17.2-pg17
          imagePullPolicy: Always
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: telemetry-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-db-secret
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: telemetry-db-secret
                  key: POSTGRES_DB
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: telemetry-data
              mountPath: /var/lib/postgresql/data
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /var/run/postgresql
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
            timeoutSeconds: 10
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
              ephemeral-storage: "100Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
              ephemeral-storage: "500Mi"
      volumes:
        - name: tmp
          emptyDir: {}
        - name: run
          emptyDir: {}

  volumeClaimTemplates:
    - metadata:
        name: telemetry-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
