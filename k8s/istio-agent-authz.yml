# Restricts agent to the ingress gateway + chat, since it
# trusts the unsigned x-gateway-claims header (app/auth.py) without a signature check.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: agent-callers
  namespace: ambitwin
spec:
  selector:
    matchLabels:
      app: agent
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/ambitwin/sa/ambitwin-gateway-istio
    - from:
        - source:
            principals:
              - cluster.local/ns/ambitwin/sa/chat
