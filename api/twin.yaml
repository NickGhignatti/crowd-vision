openapi: 3.1.0
info:
  title: Twin API
  version: 2.0.0
  description: |
    `digital-twin`: the building model — rooms, where sensors sit, which domains may see it.

    - A building's id is a UUID the service generates; a client never sends one.
    - An upload is **accepted first and built later**: `POST /register` answers `202` with an
      id, then a worker registers the building with telemetry. Poll
      `GET /building/{id}/status` until it says `ready` or `failed`.
    - Rooms are written once, by the upload. No route edits a room afterwards.
    - Reading needs membership in one of the building's domains; changing needs an editing role.
    - When rate limiting is on, more than 300 requests a minute from one IP get `429` with an
      empty body.

    Errors are `{ type, message }` (see `error.yaml`).
servers:
  - url: http://localhost/twin
    description: Edge route for digital-twin

tags:
  - name: Buildings
    description: Upload, read and change buildings
  - name: Placements
    description: Where each sensor physically sits
  - name: Observability
    description: Health, metrics and the metric catalog

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: authentication_token
      description: The gateway JWT. The edge checks it and passes the claims on as `x-gateway-claims`.

  parameters:
    BuildingId:
      in: path
      name: id
      required: true
      schema:
        type: string
        format: uuid
      description: Server-generated UUID of the building.
      example: "42bc920a-8c39-48ae-b033-376739c8ebf0"

  schemas:
    Coordinates:
      type: object
      required: [x, y, z]
      properties:
        x: { type: number, example: 0 }
        y: { type: number, example: 0 }
        z: { type: number, example: 0 }

    Dimensions:
      type: object
      required: [width, height, depth]
      properties:
        width: { type: number, example: 10 }
        height: { type: number, example: 3 }
        depth: { type: number, example: 8 }

    Room:
      type: object
      required: [id, name, capacity, position, dimensions]
      properties:
        id:
          type: string
          description: Id from the uploaded model file.
          example: "G-Room-001"
        name:
          type: string
          description: Display name. Falls back to `id` when blank.
          example: "Ground Floor Lab"
        capacity:
          type: number
          minimum: 0
          description: Maximum safe occupancy in people.
          example: 30
        position: { $ref: "#/components/schemas/Coordinates" }
        dimensions: { $ref: "#/components/schemas/Dimensions" }
        color:
          type: string
          description: Colour for the 3D viewer. Omitted when not set.
          example: "#4ade80"

    RoomInput:
      type: object
      required: [id, position, dimensions]
      properties:
        id: { type: string, example: "G-Room-001" }
        name: { type: string, description: Defaults to `id`. }
        capacity: { type: number, minimum: 0 }
        position: { $ref: "#/components/schemas/Coordinates" }
        dimensions: { $ref: "#/components/schemas/Dimensions" }
        color: { type: string }

    Building:
      type: object
      required: [id, name, rooms, domains]
      properties:
        id:
          type: string
          format: uuid
          example: "42bc920a-8c39-48ae-b033-376739c8ebf0"
        name:
          type: string
          description: Display name. A blank one is backfilled on read.
          example: "Engineering Block"
        rooms:
          type: array
          items: { $ref: "#/components/schemas/Room" }
        domains:
          type: array
          items: { type: string }
          description: The domains that may see the building.
          example: ["acme"]

    Placement:
      description: |
        Where one sensor sits, in the building's own axes (the same ones a room's `position`
        uses). `sensorId` is generated by telemetry and holds only letters, digits, `-` and `_`.
      type: object
      required: [sensorId, position]
      properties:
        sensorId:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          example: "5c1e0b7a-9f2d-4c1e-8a61-3b7e0d2f9c44"
        position: { $ref: "#/components/schemas/Coordinates" }

    MetricFieldContract:
      type: object
      required: [name, type, required]
      properties:
        name: { type: string }
        type: { type: string, example: string }
        required: { type: boolean }
        description: { type: string }

    MetricContract:
      type: object
      required: [kind, label, interface, unit, fields, actions]
      properties:
        kind: { type: string, example: "roomName" }
        label: { type: string, example: "Room" }
        interface: { type: string, example: "IRoom" }
        unit: { type: [string, "null"] }
        fields:
          type: array
          items: { $ref: "#/components/schemas/MetricFieldContract" }
        actions:
          type: array
          items: { type: object }

security:
  - sessionCookie: []

paths:
  /register:
    post:
      tags: [Buildings]
      summary: Upload a building
      description: |
        Needs an editing role in **every** listed domain. The upload is stored and answered at
        once; the building appears only after the worker has registered it with telemetry.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rooms, domains]
              properties:
                name: { type: string, description: Defaults to `Building`. }
                rooms:
                  type: array
                  items: { $ref: "#/components/schemas/RoomInput" }
                domains:
                  type: array
                  minItems: 1
                  items: { type: string }
            example:
              name: "Engineering Block"
              domains: ["acme"]
              rooms:
                - id: "G-Room-001"
                  name: "Ground Floor Lab"
                  capacity: 30
                  position: { x: 0, y: 0, z: 0 }
                  dimensions: { width: 10, height: 3, depth: 8 }
                  color: "#4ade80"
      responses:
        "202":
          description: Accepted. Poll the status with this id.
          content:
            application/json:
              schema:
                type: object
                required: [buildingId]
                properties:
                  buildingId: { type: string, format: uuid }
        "400": { $ref: "error.yaml#/components/responses/BadRequest" }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "error.yaml#/components/responses/Forbidden" }

  /building/{id}/status:
    get:
      tags: [Buildings]
      summary: Follow an upload
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "200":
          description: Where the upload is.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [pending, ready, failed] }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "404": { $ref: "error.yaml#/components/responses/NotFound" }

  /building/{id}:
    parameters:
      - $ref: "#/components/parameters/BuildingId"
    get:
      tags: [Buildings]
      summary: Get a building
      description: Needs membership in one of the building's domains.
      responses:
        "200":
          description: The building with its rooms.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "error.yaml#/components/responses/Forbidden" }
        "404": { $ref: "error.yaml#/components/responses/NotFound" }
    patch:
      tags: [Buildings]
      summary: Rename, move between domains, or set the temperature limit
      description: |
        Needs an editing role in one of the building's domains. Rooms cannot be changed here.
        `maxTemperature` is not stored here: it is passed on to telemetry as the building's
        temperature threshold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "New Block Name" }
                domains:
                  type: array
                  items: { type: string }
                maxTemperature: { type: number, example: 26 }
      responses:
        "200":
          description: The changed building.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Building" }
        "400": { $ref: "error.yaml#/components/responses/BadRequest" }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "error.yaml#/components/responses/Forbidden" }
        "404": { $ref: "error.yaml#/components/responses/NotFound" }

  /building/{id}/sync:
    post:
      tags: [Buildings]
      summary: Register an existing building with telemetry again
      description: |
        Use it when telemetry lost the building, instead of uploading it again. Needs an editing
        role in one of the building's domains.
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "202": { description: Request sent again. Empty body. }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "error.yaml#/components/responses/Forbidden" }
        "404": { $ref: "error.yaml#/components/responses/NotFound" }

  /buildings/{domain}:
    get:
      tags: [Buildings]
      summary: List a domain's buildings
      description: Needs membership in the domain.
      parameters:
        - in: path
          name: domain
          required: true
          schema: { type: string }
          example: "acme"
      responses:
        "200":
          description: The buildings, maybe none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Building" }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "error.yaml#/components/responses/Forbidden" }

  /buildings/counts:
    post:
      tags: [Buildings]
      summary: Count buildings per domain
      description: |
        A domain the caller cannot read is left out of the answer, not refused. At most 500
        domains per call.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domains]
              properties:
                domains:
                  type: array
                  maxItems: 500
                  items: { type: string }
            example: { domains: ["acme", "acme-north"] }
      responses:
        "200":
          description: Domain name to building count.
          content:
            application/json:
              schema:
                type: object
                required: [counts]
                properties:
                  counts:
                    type: object
                    additionalProperties: { type: integer }
              example: { counts: { acme: 3, acme-north: 1 } }
        "400": { $ref: "error.yaml#/components/responses/BadRequest" }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }

  /domain/{building}:
    get:
      tags: [Buildings]
      summary: List a building's domains
      description: |
        `building` is an id or, when no id matches, a name (every building with that name counts).
        Not filtered by the caller's memberships: telemetry and notification call it with no
        user memberships and filter the answer themselves.
      parameters:
        - in: path
          name: building
          required: true
          schema: { type: string }
          example: "Engineering Block"
      responses:
        "200":
          description: Domain names; empty when nothing matches.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
              example: ["acme", "acme-north"]
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }

  /building/{id}/placements:
    parameters:
      - $ref: "#/components/parameters/BuildingId"
    get:
      tags: [Placements]
      summary: List where the building's sensors sit
      description: |
        Telemetry owns the sensors and never stores coordinates; this is the only record of where
        a sensor is. Needs membership in one of the building's domains.
      responses:
        "200":
          description: Every placement, ordered by sensor id; `[]` when none.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Placement" }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "error.yaml#/components/responses/Forbidden" }
        "404": { $ref: "error.yaml#/components/responses/NotFound" }
    put:
      tags: [Placements]
      summary: Place, move and remove sensors in one batch
      description: |
        All or nothing: the whole batch is checked first, then saved in one write. Sending the
        same batch twice gives the same result, so a retry is safe. At most 200 items across
        `upsert` and `delete`, and a sensor may appear once. Needs an editing role in one of the
        building's domains.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                upsert:
                  type: array
                  items: { $ref: "#/components/schemas/Placement" }
                delete:
                  type: array
                  description: Sensor ids to un-place; an id with no placement is ignored.
                  items: { type: string }
            example:
              upsert:
                - sensorId: "5c1e0b7a-9f2d-4c1e-8a61-3b7e0d2f9c44"
                  position: { x: 2.5, y: 1.2, z: 4 }
              delete: ["9ab0c3de-1f2a-4b5c-8d6e-7f8091a2b3c4"]
      responses:
        "204": { description: Saved. }
        "400": { $ref: "error.yaml#/components/responses/BadRequest" }
        "401": { $ref: "error.yaml#/components/responses/Unauthorized" }
        "403": { $ref: "error.yaml#/components/responses/Forbidden" }
        "404": { $ref: "error.yaml#/components/responses/NotFound" }

  /health:
    get:
      tags: [Observability]
      summary: Liveness probe
      security: []
      responses:
        "200": { description: Up. }

  /metrics:
    get:
      tags: [Observability]
      summary: Prometheus metrics
      security: []
      responses:
        "200":
          description: Prometheus text format.
          content:
            text/plain:
              schema: { type: string }

  /contracts:
    get:
      tags: [Observability]
      summary: Metrics this service offers the dashboard
      description: Read by dashboard to build its column catalog.
      security: []
      responses:
        "200":
          description: The service name and its metrics.
          content:
            application/json:
              schema:
                type: object
                required: [service, metrics]
                properties:
                  service: { type: string, example: "digital-twin" }
                  metrics:
                    type: array
                    items: { $ref: "#/components/schemas/MetricContract" }
