openapi: 3.1.0
info:
  title: Telemetry Service API
  description: >
    Ingestion gateway for IoT telemetry. Accepts readings on a fast path,
    serves latest/aggregated reads, manages per-building and per-room
    thresholds, and dispatches commands to sensor actuators. Metrics are
    resolved dynamically by a microkernel; the currently registered types are
    `temperature`, `peopleCount`, and `airQuality`. Every error response has
    the shape `{ type, message }` — see the `Error` schema.
  version: 1.0.0
servers:
  - url: http://localhost/telemetry
    description: Gateway endpoint for the Telemetry Service

components:
  securitySchemes:
    gatewayClaims:
      type: apiKey
      in: header
      name: x-gateway-claims
      description: >
        Base64-encoded Stable Claims Contract injected by the edge after it
        verifies the internal RS256 JWT. Clients never set this header —
        the edge strips any client-supplied value and re-injects its own.
    ingestSignature:
      type: apiKey
      in: header
      name: x-signature
      description: >
        Lowercase-hex HMAC-SHA256 over the raw request body, keyed by
        TELEMETRY_INGEST_SECRET. A sensor gateway has no user JWT, so this is
        how it authenticates itself. The signature covers the exact bytes on
        the wire — sign the string you send, never a re-serialised copy.
    collectorSignature:
      type: apiKey
      in: header
      name: x-signature
      description: >
        Lowercase-hex HMAC-SHA256, keyed by TELEMETRY_INGEST_SECRET, over
        "GET /collector\n" followed by the x-timestamp value. A GET has no body,
        so the signed timestamp is what proves the caller holds the key; a
        timestamp more than 300 s from telemetry's clock is refused.
    collectorTimestamp:
      type: apiKey
      in: header
      name: x-timestamp
      description: Unix seconds, decimal — the value the x-signature covers.

  parameters:
    SensorType:
      in: path
      name: sensorType
      required: true
      description: The metric discriminant; must match a registered module.
      schema:
        type: string
        enum: [temperature, peopleCount, airQuality]
    BuildingId:
      in: path
      name: buildingId
      required: true
      schema:
        type: string

  schemas:
    Error:
      description: The shape every 4xx/5xx response uses.
      type: object
      required: [type, message]
      properties:
        type: { type: string, example: "Validation Error" }
        message: { type: string, example: "metric: must be a non-empty string." }

    TemperatureReading:
      type: object
      required: [buildingId, roomId, timestamp, temperature]
      properties:
        buildingId: { type: string, example: "hq-01" }
        roomId: { type: string, example: "room-03" }
        timestamp: { type: integer, description: "Unix timestamp in milliseconds", example: 1718000000000 }
        temperature: { type: number, example: 22.4 }

    PeopleCountReading:
      type: object
      required: [buildingId, roomId, timestamp, peopleCount]
      properties:
        buildingId: { type: string }
        roomId: { type: string }
        timestamp: { type: integer, description: "Unix timestamp in milliseconds" }
        peopleCount: { type: integer, example: 17 }

    AirQualityReading:
      description: >
        Only `pm25` and `co2` are required alongside the envelope; every other
        measurement is optional and simply absent from the stored payload when
        omitted. `indoor_aqi` is the value the dashboard aggregates.
      type: object
      required: [buildingId, roomId, timestamp, pm25, co2]
      properties:
        buildingId: { type: string }
        roomId: { type: string }
        timestamp: { type: integer, description: "Unix timestamp in milliseconds" }
        scenario: { type: string, description: "Optional simulation scenario identifier" }
        pm25: { type: number }
        pm10: { type: number }
        co2: { type: number }
        voc: { type: number }
        temperature: { type: number }
        humidity: { type: number }
        aqi: { type: number }
        indoor_aqi: { type: number }

    IngestionPayload:
      description: >
        A reading. The `type` field selects the module; the remaining fields are
        the metric-specific reading body.
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [temperature, peopleCount, airQuality]
      oneOf:
        - $ref: "#/components/schemas/TemperatureReading"
        - $ref: "#/components/schemas/PeopleCountReading"
        - $ref: "#/components/schemas/AirQualityReading"

    SensorBatch:
      description: >
        One building's sensor edits, applied all-or-nothing: one bad item
        rejects the batch and nothing is written. At most 200 items across
        `create`, `update` and `delete`. Ids are server-generated; a `sensorId`
        on a create item is ignored.
      type: object
      properties:
        create:
          type: array
          items:
            type: object
            required: [ref, name, sensorType]
            properties:
              ref: { type: string, description: "Client-side key, echoed back with the new id.", example: "d1" }
              name: { type: string, example: "Router hall B" }
              sensorType: { type: string, description: "A device kind from `GET /devices`, never a metric.", example: "router" }
              roomId: { type: string, nullable: true, description: "A room of this building, or null/absent for outside every room.", example: null }
              driver: { type: string, example: "tp-simulator" }
              endpoint: { type: string, example: "http://device.local" }
        update:
          type: array
          items:
            type: object
            required: [sensorId]
            properties:
              sensorId: { type: string, example: "5c1e0b7a-9f2d-4c1e-8a61-3b7e0d2f9c44" }
              name: { type: string, description: "Absent keeps the current name." }
              roomId: { type: string, nullable: true, description: "Absent keeps the room; null moves the sensor outside every room." }
        delete:
          type: array
          items: { type: string }
          example: ["9ab0c3de-1f2a-4b5c-8d6e-7f8091a2b3c4"]

    ItemError:
      type: object
      properties:
        ref: { type: string, description: "The create item's `ref`, or the sensor id of an update/delete." }
        field: { type: string, example: "roomId" }
        message: { type: string, example: "must be null or a room of this building." }

    ReadingView:
      description: >
        A stored reading as served back. The envelope is reconstructed from the
        row's own columns, and every metric-specific field sits at the top level
        under its own name — the same flat shape the `telemetry` socket event
        uses, so a client can read a REST snapshot and a live event the same way.
        `value` repeats the metric's own value field for convenience.
      type: object
      properties:
        building: { type: string, example: "hq-01" }
        roomId: { type: string, example: "room-03" }
        timestamp: { type: integer, description: "Unix timestamp in milliseconds" }
        value: { type: number, example: 42.5 }
      additionalProperties: true
      example:
        building: "hq-01"
        roomId: "room-03"
        timestamp: 1718000000000
        value: 42.5
        indoor_aqi: 42.5
        pm25: 8.0
        co2: 700.0

    Sensor:
      description: >
        A registered physical sensor. `actions` is the intersection of what the
        metric declares and what this sensor's driver binding can actually
        reach — empty for a sensor registered without a driver/endpoint.
      type: object
      properties:
        buildingId: { type: string }
        roomId: { type: string, nullable: true, description: "null for a sensor outside every room." }
        sensorId: { type: string, description: "Server-generated UUID." }
        name: { type: string }
        sensorType: { type: string, description: "The device kind, e.g. `router`." }
        actions:
          type: array
          items: { type: string }
          example: ["increase", "decrease"]

    ActionRequest:
      description: >
        A command in this service's own vocabulary. `action` must be one the
        metric's plugin declares, and `arguments` are named — validated against
        that action's parameter specs before anything is dispatched. Translation
        into a device's own wire format happens in the dispatch adapter, not here.
      type: object
      required: [metric, buildingId, sensorId, action]
      properties:
        metric: { type: string, example: "temperature" }
        buildingId: { type: string, example: "hq-01" }
        sensorId: { type: string, description: "The sensor is found by building and id; a `roomId` sent here is ignored.", example: "5c1e0b7a-9f2d-4c1e-8a61-3b7e0d2f9c44" }
        action: { type: string, description: "An action declared by the metric's plugin.", example: "increase" }
        arguments:
          type: object
          description: Named parameters for the action. Omitted or `{}` when it takes none.
          additionalProperties: true
          example: { step: 1 }

    ThresholdClone:
      description: Building clone pushed by the digital-twin on registration/update.
      type: object
      properties:
        name: { type: string }
        maxTemperature: { type: number }
        rooms:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }

    MetricContract:
      type: object
      properties:
        service: { type: string, example: "telemetry" }
        metrics:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, example: "temperature" }
              label: { type: string, example: "Temperature" }
              interface: { type: string, example: "ITemperature" }
              unit: { type: [string, "null"], example: "C" }
              fields:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, example: "temperature" }
                    type: { type: string, example: "Finite" }
                    required: { type: boolean }
              actions:
                type: array
                items:
                  type: object
                  properties:
                    name: { type: string, example: "increase" }
                    label: { type: string, example: "Increase temperature" }
                    parameters:
                      type: array
                      items:
                        type: object
                        properties:
                          name: { type: string, example: "step" }
                          kind: { type: string, example: "Finite" }
                          required: { type: boolean }

# All endpoints are JWT-protected (browser cookie, or a bearer forwarded by the
# digital-twin) except the device-facing ingest hot path and the public
# discovery endpoints, which override this with `security: []`.
security:
  - gatewayClaims: []

paths:
  /collector:
    get:
      summary: Routers an on-site collector polls
      description: >
        Every router sensor placed in a room, grouped by building: what an
        ap-collector polls and which room each one counts into. Outdoor routers
        and buildings with no router are left out.

        Addresses only, never logins: `endpoint` is the router's ubus URL on the
        site network, and the credentials to use it stay in the collector's own
        configuration. Ungated at the edge like `/ingest`, and signed by the
        caller instead.
      tags: [Ingestion]
      security:
        - collectorSignature: []
          collectorTimestamp: []
      responses:
        "200":
          description: The routers, by building
          content:
            application/json:
              schema:
                type: object
                required: [buildings]
                properties:
                  buildings:
                    type: array
                    items:
                      type: object
                      required: [buildingId, routers]
                      properties:
                        buildingId: { type: string, example: "bldg-3f2b4c5d" }
                        routers:
                          type: array
                          minItems: 1
                          items:
                            type: object
                            required: [sensorId, roomId]
                            properties:
                              sensorId: { type: string, format: uuid }
                              roomId: { type: string, example: "room-lab-2" }
                              driver: { type: string, example: "openwrt-hostapd" }
                              endpoint: { type: string, example: "http://10.0.4.12/ubus" }
        "401":
          description: Unsigned, mis-signed, or stamped outside the 300 s window

  /ingest:
    post:
      summary: Ingest one building tick
      description: >
        One building's readings for one instant, as one message: one HMAC, one
        bulk insert, one fan-out event. A single device sends a `readings` array
        of one — there is no separate single-reading route.

        `buildingId` lives on the envelope and is stamped onto every reading; a
        reading naming a different building is rejected, since a batch maps to
        exactly one fan-out channel. `type` selects the plugin for each reading
        and is stripped from it.

        All-or-nothing: if any reading fails validation nothing is persisted and
        nothing is published, and the response names the offending index. A
        threshold-evaluation failure is logged and does not fail the ingest; a
        persistence failure does.

        Requires an `x-signature` HMAC over the raw body. The route carries no
        user JWT and is ungated at the edge, but it is not open — an unsigned or
        mis-signed request is rejected before the body is parsed.
      tags: [Ingestion]
      security:
        - ingestSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [buildingId, readings]
              properties:
                buildingId: { type: string, example: "bldg-1" }
                readings:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/IngestionPayload"
      responses:
        "202":
          description: The whole tick was accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, example: true }
                  readings: { type: integer, example: 12 }
        "401":
          description: Missing, malformed or mismatched `x-signature`
        "413":
          description: Body exceeds the 1 MiB ingest limit
        "422":
          description: >
            Missing envelope fields, empty batch, more than 500 readings, an
            unknown sensor type, or a reading that failed validation — `details`
            names the offending index.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: "Payload validation failed." }
                  details:
                    type: array
                    items: { type: string }
  /sensors/buildings/{buildingId}:
    post:
      summary: Create, update and delete a building's sensors in one batch
      description: >
        Validates every item before writing any, then applies the batch in one
        transaction. Needs an editing role in one of the building's domains.
      tags: [Registry]
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SensorBatch" }
      responses:
        "200":
          description: Batch applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  created:
                    type: array
                    items:
                      type: object
                      properties:
                        ref: { type: string, example: "d1" }
                        sensorId: { type: string, example: "5c1e0b7a-9f2d-4c1e-8a61-3b7e0d2f9c44" }
        "400":
          description: Malformed batch (not an object, a list that is not an array, an item without `ref`/`sensorId`), or over 200 items
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller has no editing role in any of the building's domains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The building is not registered with telemetry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: One or more items are invalid; nothing was written
          content:
            application/json:
              schema:
                type: object
                properties:
                  type: { type: string, example: "Rejected Error" }
                  message: { type: string, example: "1 item(s) rejected." }
                  errors:
                    type: array
                    items: { $ref: "#/components/schemas/ItemError" }
    get:
      summary: List every sensor registered in a building
      tags: [Registry]
      parameters:
        - $ref: "#/components/parameters/BuildingId"
      responses:
        "200":
          description: Registered sensors for the building
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Sensor" }

  /sensors/buildings/{buildingId}/rooms/{roomId}:
    get:
      summary: List sensors registered in a single room
      tags: [Registry]
      parameters:
        - $ref: "#/components/parameters/BuildingId"
        - in: path
          name: roomId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Registered sensors for the room
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Sensor" }

  /executeAction:
    post:
      summary: Dispatch a command to a sensor's actuator
      description: >
        Two stages. The kernel resolves the metric's plugin, checks `action`
        against its declared `ActionSpec`s and validates `arguments` against
        that action's parameters. The dispatch adapter then looks up the
        sensor's `driver` and `endpoint`, translates the command into that
        driver's own path, method and field names, and calls it. Synchronous:
        the response reflects the downstream outcome.
      tags: [Actions]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actionData]
              properties:
                actionData:
                  $ref: "#/components/schemas/ActionRequest"
      responses:
        "200":
          description: The downstream endpoint accepted the command
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted: { type: boolean, example: true }
                  action: { type: string, example: "increase" }
        "400":
          description: "`actionData` is not an object, a required field is blank, or an argument fails its parameter spec"
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Caller has no editing role in any of the building's domains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: >
            Unknown metric, an action the metric does not declare, or a sensor
            with no driver/endpoint binding for that action.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The downstream actuator endpoint errored or was unreachable
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /simulation/buildings/{buildingId}:
    parameters:
      - $ref: "#/components/parameters/BuildingId"
    put:
      summary: Start simulating a building's sensors
      description: >
        Reads the building's sensors and sends each configured simulator the
        ones whose device kind it claims, replacing whatever it held. Every
        simulator is told, even with an empty list, which stops it for this
        building. Routers and outdoor sensors are sent to no simulator.
        Simulators are only synchronised here: sensors edited during a run are
        picked up at the next start. Needs an editing role.
      tags: [Simulation]
      responses:
        "204":
          description: Every simulator accepted its sensors
        "403":
          description: Caller has no editing role in any of the building's domains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: The building is not registered, or no simulator is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: >
            A simulator failed or did not answer within 5 s. The others were
            still told, so a retry is safe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    delete:
      summary: Stop simulating a building
      tags: [Simulation]
      responses:
        "204":
          description: Every simulator stopped the building
        "403":
          description: Caller has no editing role in any of the building's domains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: No simulator is configured
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: A simulator failed or did not answer within 5 s
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: Whether any simulator is running the building
      description: A simulator that does not answer counts as not running.
      tags: [Simulation]
      responses:
        "200":
          description: Simulation status
          content:
            application/json:
              schema:
                type: object
                required: [running]
                properties:
                  running: { type: boolean }
        "403":
          description: Caller has no reading role in any of the building's domains
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /{sensorType}/latest:
    get:
      summary: Latest reading for one room
      tags: [Reads]
      parameters:
        - $ref: "#/components/parameters/SensorType"
        - in: query
          name: building
          required: true
          schema: { type: string }
        - in: query
          name: roomId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The most recent reading
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: "#/components/schemas/ReadingView" }
        "400":
          description: "`roomId` is missing"
        "403":
          description: Caller is not a member of any of the building's domains
        "404":
          description: Unknown sensor type, or the room has no readings

  /{sensorType}/entireBuilding:
    get:
      summary: Latest reading for every room in a building
      tags: [Reads]
      parameters:
        - $ref: "#/components/parameters/SensorType"
        - in: query
          name: building
          required: true
          schema: { type: string }
      responses:
        "200":
          description: One latest reading per room. Empty array when the building has none.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/ReadingView" }
        "403":
          description: Caller is not a member of any of the building's domains
        "404":
          description: Unknown sensor type

  /{sensorType}/dashboard:
    get:
      summary: Bucketed time-series for the dashboard
      tags: [Reads]
      parameters:
        - $ref: "#/components/parameters/SensorType"
        - in: query
          name: building
          required: true
          schema: { type: string }
        - in: query
          name: timeRange
          required: false
          description: Anything unrecognised, including an absent value, means `1D`.
          schema: { type: string, example: "1D", enum: ["1D", "1W", "1M", "custom"] }
        - in: query
          name: start
          required: false
          description: Unix ms. Required when `timeRange=custom`; ignored otherwise.
          schema: { type: integer }
        - in: query
          name: end
          required: false
          description: Unix ms. Defaults to now when `timeRange=custom` omits it.
          schema: { type: integer }
        - in: query
          name: roomId
          required: false
          description: Omit to aggregate across the whole building.
          schema: { type: string }
        - in: query
          name: aggMode
          required: false
          description: Anything unrecognised, including an absent value, means `avg`.
          schema: { type: string, example: "avg", enum: [avg, sum, min, max] }
      responses:
        "200":
          description: Aggregated buckets
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        timestamp: { type: integer }
                        value: { type: number }
        "400":
          description: "`timeRange=custom` without a `start`"
        "404":
          description: Unknown sensor type

  /thresholds/buildings/{buildingId}:
    parameters:
      - $ref: "#/components/parameters/BuildingId"
    put:
      summary: Register/update a building clone
      description: Called by the digital-twin to seed threshold records for every registered module.
      tags: [Thresholds]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ThresholdClone"
      responses:
        "200":
          description: Building registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: "Building registered" }
    get:
      summary: Get the threshold clone for the twin view
      tags: [Thresholds]
      responses:
        "200":
          description: The clone, or null if none exists
          content:
            application/json:
              schema:
                type: [object, "null"]
                properties:
                  buildingId: { type: string }
                  maxTemperature: { type: number }
                  rooms:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        maxTemperature: { type: number }

  /thresholds/{sensorType}/buildings/{buildingId}:
    parameters:
      - $ref: "#/components/parameters/SensorType"
      - $ref: "#/components/parameters/BuildingId"
    get:
      summary: Get a metric's thresholds for a building
      tags: [Thresholds]
      responses:
        "200":
          description: Threshold document slice
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object }
        "404":
          description: Unknown sensor type
    patch:
      summary: Update a metric's building-level thresholds
      tags: [Thresholds]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated thresholds
        "404":
          description: Unknown sensor type

  /thresholds/{sensorType}/buildings/{buildingId}/rooms:
    patch:
      summary: Update a metric's thresholds for many rooms at once
      description: >
        Every room in one request. Registering a building sets one threshold per
        room, and as one request per room that was both the bulk of the round
        trips and a way to end up half applied. Every patch is validated before
        any is written, so a single bad bound rejects the whole batch and stores
        nothing. An empty object is accepted and changes nothing.
      tags: [Thresholds]
      parameters:
        - $ref: "#/components/parameters/SensorType"
        - $ref: "#/components/parameters/BuildingId"
      requestBody:
        required: true
        description: Room id to that room's bounds for this metric.
        content:
          application/json:
            schema:
              type: object
              additionalProperties: { type: object }
            example:
              f0-reception: { maxPeople: 12 }
              f0-lobby: { maxPeople: 40 }
      responses:
        "200":
          description: The stored thresholds, keyed by room id
        "400":
          description: A bound the metric does not declare, or a non-numeric value
        "403":
          description: No edit rights on the building
        "404":
          description: Unknown sensor type

  /thresholds/{sensorType}/buildings/{buildingId}/rooms/{roomId}:
    patch:
      summary: Update a metric's room-level thresholds
      tags: [Thresholds]
      parameters:
        - $ref: "#/components/parameters/SensorType"
        - $ref: "#/components/parameters/BuildingId"
        - in: path
          name: roomId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200":
          description: Updated room thresholds
        "404":
          description: Unknown sensor type

  /health:
    get:
      summary: Liveness
      tags: [Discovery]
      security: []
      responses:
        "200":
          description: The process is up

  /metrics:
    get:
      summary: Prometheus metrics
      description: >
        Text exposition. Domain series are prefixed `telemetry_`, as are the HTTP
        ones, so they never collide with another service's `http_requests_total`.
      tags: [Discovery]
      security: []
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema: { type: string }

  /devices:
    get:
      summary: Device kinds a sensor may be registered as
      description: >
        A sensor is a physical device, and one device may report several metrics: a
        router reports both `totalDeviceCount` and `ratioDeviceCount`. Every metric in
        `/contracts` belongs to exactly one kind here. Kept apart from `/contracts`,
        whose shape dashboard parses too; only the sensor editor reads this.
      tags: [Discovery]
      security: []
      responses:
        "200":
          description: Every device kind and the metrics it reports
          content:
            application/json:
              schema:
                type: object
                properties:
                  devices:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, example: "router" }
                        label: { type: string, example: "Router" }
                        metrics:
                          type: array
                          items: { type: string }
                          example: ["totalDeviceCount", "ratioDeviceCount"]

  /contracts:
    get:
      summary: Metric catalog
      description: Self-describing list of the metrics this service produces.
      tags: [Discovery]
      security: []
      responses:
        "200":
          description: The service metric contract
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricContract"
