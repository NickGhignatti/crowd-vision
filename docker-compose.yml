services:
  gateway:
    cpus: "3"
    image: caddy:latest
    ports:
      - "${BACKEND_PORT}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      claims-gateway:
        condition: service_started
        required: false
      twin-service:
        condition: service_started
        required: false
      sensor-service:
        condition: service_started
        required: false
      socket-server:
        condition: service_started
        required: false
      chat-service:
        condition: service_started
        required: false

  redis:
    cpus: "3"
    image: redis:alpine
    container_name: services-broker
    restart: always
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    cpus: "3"
    image: apache/kafka:3.9.0
    container_name: services-kafka
    restart: always
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    cpus: "3"
    image: quay.io/keycloak/keycloak:26.0
    container_name: crowd-vision-keycloak
    command: ["start-dev", "--features=organization", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?set in .env}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:-http://localhost:8090}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      # Enables ${ENV_VAR:default} substitution in the imported realm JSON so the
      # Google IdP client id/secret come from the environment, not git.
      JAVA_OPTS_APPEND: -Dkeycloak.migration.replace-placeholders=true
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-not-configured}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-not-configured}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8090:8080"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro,z
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '\"UP\"' <&3",
        ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  keycloak-db:
    cpus: "3"
    image: postgres:17-alpine
    container_name: crowd-vision-keycloak-db
    restart: always
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?set in .env}
      POSTGRES_DB: keycloak
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 60s

  prometheus:
    cpus: "3"
    image: prom/prometheus:latest
    container_name: crowd-vision-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.external-url=${DEV_URL}:${BACKEND_PORT}/prometheus/"
      - "--web.route-prefix=/"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - ./prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro,z

  grafana:
    cpus: "3"
    image: grafana/grafana:latest
    container_name: crowd-vision-grafana
    environment:
      - GF_SERVER_ROOT_URL=${DEV_URL}:${BACKEND_PORT}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  caddy_data:
  caddy_config:
  grafana_data:
  keycloak_postgres_data:
